version: 2.1

jobs:
  android-build:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

    steps:
      - checkout

      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
            - gradle-v1-

      - run:
          name: Verify Java and Android toolchain
          command: |
            java -version
            sdkmanager --version
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run:
          name: Install Gradle 9.6
          command: |
            if [ ! -x "$HOME/gradle/gradle-9.6.0/bin/gradle" ]; then
              mkdir -p "$HOME/gradle"
              curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle-9.6.0-bin.zip
              unzip -q /tmp/gradle-9.6.0-bin.zip -d "$HOME/gradle"
            fi
            "$HOME/gradle/gradle-9.6.0/bin/gradle" --version

      - run:
          name: Validate level pack
          command: python3 scripts/generate-hard-levels.py --check

      - run:
          name: Verify levels and gameplay rules
          command: python3 scripts/verify-levels.py

      - run:
          name: Verify wallet
          command: bash scripts/test-wallet.sh

      - run:
          name: Verify premium UI/UX contract
          command: python3 scripts/verify-ui-ux.py

      - run:
          name: Android lint
          command: |
            "$HOME/gradle/gradle-9.6.0/bin/gradle" :app:lintDebug --stacktrace --no-daemon

      - run:
          name: Build APKs and Play Store bundle
          command: |
            "$HOME/gradle/gradle-9.6.0/bin/gradle" \
              :app:assembleDebug \
              :app:assembleRelease \
              :app:bundleRelease \
              :app:assembleDebugAndroidTest \
              --stacktrace --no-daemon

      - run:
          name: Verify build outputs
          command: |
            python3 scripts/verify-build.py
            APK="app/build/outputs/apk/debug/app-debug.apk"
            BYTES=$(stat -c%s "$APK")
            echo "Installable debug APK size: $BYTES bytes"
            test "$BYTES" -gt 2000000

      - run:
          name: Package clear download artifacts
          command: |
            rm -rf dist
            mkdir -p dist
            cp app/build/outputs/apk/debug/app-debug.apk dist/INSTALL-THIS-ArrowEscape-1.0.0-test.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/PLAY-STORE-ArrowEscape-1.0.0-unsigned.aab
            {
              echo "INSTALL THIS ON PHONE/TABLET:"
              ls -lh dist/INSTALL-THIS-ArrowEscape-1.0.0-test.apk
              echo
              echo "PLAY STORE BUNDLE (UNSIGNED — sign only after APK approval):"
              ls -lh dist/PLAY-STORE-ArrowEscape-1.0.0-unsigned.aab
            } > dist/BUILD-SIZES.txt
            sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt

      - save_cache:
          key: gradle-v1-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/notifications
            - ~/gradle/gradle-9.6.0

      - store_artifacts:
          path: dist/INSTALL-THIS-ArrowEscape-1.0.0-test.apk
          destination: INSTALL-THIS-ArrowEscape-1.0.0-test.apk

      - store_artifacts:
          path: dist/PLAY-STORE-ArrowEscape-1.0.0-unsigned.aab
          destination: PLAY-STORE-ArrowEscape-1.0.0-unsigned.aab

      - store_artifacts:
          path: dist/BUILD-SIZES.txt
          destination: BUILD-SIZES.txt

      - store_artifacts:
          path: dist/SHA256SUMS.txt
          destination: SHA256SUMS.txt

workflows:
  build-arrow-escape:
    jobs:
      - android-build
