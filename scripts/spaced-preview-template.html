<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrow Escape · Readable levels</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030916;color:#edf5ff;font-family:system-ui,sans-serif;padding:18px 10px}.app{max-width:440px;margin:auto;background:#050d1e;border-radius:24px;overflow:hidden}.top{margin:8px;padding:16px;background:linear-gradient(120deg,#21375e,#24264c);border:1px solid #426180;border-radius:20px;text-align:center}.top h1{font-size:26px;margin:0 0 3px}.sub{color:#aabbd8;font-size:13px}.stats{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.hearts{color:#ff5d86;font-size:25px;letter-spacing:6px}.stat{padding:8px 14px;background:#0b203a;border:1px solid #244c6e;border-radius:15px;font-weight:700}.coins{background:#392906;color:#ffe28a;border-color:#70591c}.board{display:block;width:100%;aspect-ratio:27/43;padding:22px 20px 6px;overflow:visible}.arrow-line{fill:none;stroke:#50e0ff;stroke-width:.105;stroke-linejoin:round;stroke-linecap:round}.arrow-head{fill:#50e0ff}.hit{fill:none;stroke:transparent;stroke-width:.7;cursor:pointer}.arrow:focus .arrow-line{stroke:#ffd258;stroke-width:.2}.arrow.bad .arrow-line,.arrow.bad .arrow-head{stroke:#ff668c;fill:#ff668c}.arrow.hint .arrow-line,.arrow.hint .arrow-head{stroke:#ffd258;fill:#ffd258}.status{min-height:40px;text-align:center;color:#9baed0;font-size:13px;padding:8px 12px}.tools{display:flex;gap:8px;padding:8px 12px 14px;flex-wrap:wrap}button{min-height:46px;flex:1;border-radius:16px;border:1px solid #65c7e6;background:#142d43;color:#edf5ff;padding:10px;font:600 14px system-ui;cursor:pointer}button:hover{background:#1d405a}button:disabled{opacity:.5;cursor:default}.caption{font-size:12px;text-align:center;color:#93a4c5;margin:12px auto;max-width:430px}select{background:#12243b;color:#edf5ff;border:1px solid #466a82;border-radius:9px;padding:6px;font:inherit}.selector{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}svg .shelter{fill:#10243a;stroke:#436b83;stroke-width:.08}.person{pointer-events:none}.arrow{transition:opacity .18s} @media(prefers-reduced-motion:reduce){.arrow{transition:none}}
</style></head><body>
<main class="app" id="arrow-app">
<header class="top"><h1 id="level-title">Level 1</h1><div class="sub">CH 1 · First Escape · NORMAL</div><div class="stats"><span class="stat" id="remaining">51</span><span class="hearts" aria-label="Three lives">♥♥♥</span><span class="stat coins">★ 100</span></div></header>
<svg class="board" id="board" aria-label="Arrow escape puzzle"></svg>
<div id="status" class="status" aria-live="polite">Tap an arrow with a clear escape path.</div>
<div class="tools"><button id="hint" type="button">Hint · 1</button><button id="restart" type="button">Restart</button><button id="next" type="button">Next level</button></div>
</main>
<div class="caption">Playable layout preview · simplified campaign levels 1–3</div>
<script>
(()=>{
const levels=__LEVELS__,frames=__FRAMES__,atlas='data:image/png;base64,__ATLAS__';
const root=document.getElementById('arrow-app'),board=root.querySelector('#board'),status=root.querySelector('#status');
const NS='http://www.w3.org/2000/svg';let index=0,active=[],hintUsed=false,expressionTimer;
function el(name,attrs={},parent=board){const e=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e;}
function nodes(pts){const out=[pts[0]];for(let i=1;i<pts.length;i++){const [a,b]=pts[i-1],[x,y]=pts[i],dx=Math.sign(x-a),dy=Math.sign(y-b);for(let k=1;k<=Math.abs(x-a)+Math.abs(y-b);k++)out.push([a+k*dx,b+k*dy]);}return out;}
function key(q){return q[0]+','+q[1];}
function clear(p){const lv=levels[index],others=new Set(active.filter(q=>q!==p).flatMap(q=>q.nodes.map(key))),own=new Map(p.nodes.map((q,i)=>[key(q),i]));let [x,y]=p.pts[p.pts.length-1];for(let step=1;step<=lv.w+lv.h+2;step++){x+=p.dx;y+=p.dy;if(x<0||x>lv.w||y<0||y>lv.h)return true;const k=key([x,y]);if(others.has(k)||(own.has(k)&&own.get(k)>=step))return false;}return true;}
function expression(state){const [x,y,w,h]=frames[state];root.querySelector('#person-frame').setAttribute('viewBox',[x,y,w,h].join(' '));}
function update(){const done=levels[index].pieces.length-active.length,total=levels[index].pieces.length;root.querySelector('#remaining').textContent=active.length;root.querySelector('#progress-fill').setAttribute('width',6.1*done/total);root.querySelector('#progress-label').textContent=Math.round(done/total*100)+'% CLEAR';}
function tap(p){if(!active.includes(p))return;clearTimeout(expressionTimer);if(!clear(p)){p.element.classList.add('bad');expression(1);status.textContent='Blocked! Clear the arrow in front first.';expressionTimer=setTimeout(()=>{p.element.classList.remove('bad');expression(active.length?0:3);},600);return;}
active=active.filter(q=>q!==p);p.element.remove();update();expression(active.length?2:3);status.textContent=active.length?'Good move. Find the next clear path.':'Rescued! Every arrow is clear.';expressionTimer=setTimeout(()=>expression(active.length?0:3),900);}
function load(){clearTimeout(expressionTimer);const lv=levels[index];board.replaceChildren();board.setAttribute('viewBox',[-1,-1,lv.w+2,lv.h+2].join(' '));board.setAttribute('preserveAspectRatio','none');root.querySelector('#level-title').textContent='Level '+(index+1);active=lv.pieces.map(p=>({...p,nodes:nodes(p.pts)}));hintUsed=false;root.querySelector('#hint').disabled=false;root.querySelector('#hint').textContent='Hint · 1';
for(const p of active){const g=el('g',{class:'arrow',role:'button',tabindex:'0','aria-label':'Arrow pointing '+(p.dx===1?'right':p.dx===-1?'left':p.dy===1?'down':'up')});p.element=g;const d='M'+p.pts.map(q=>q.join(' ')).join(' L');el('path',{d,class:'arrow-line'},g);const [x,y]=p.pts[p.pts.length-1],dx=p.dx,dy=p.dy,px=-dy,py=dx;el('polygon',{points:[[x+dx*.21,y+dy*.21],[x-dx*.35+px*.18,y-dy*.35+py*.18],[x-dx*.20,y-dy*.20],[x-dx*.35-px*.18,y-dy*.35-py*.18]].map(q=>q.join(',')).join(' '),class:'arrow-head'},g);el('path',{d,class:'hit'},g);g.addEventListener('click',()=>tap(p));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(p);}});}
const cx=Math.floor(lv.w/2),cy=Math.floor(lv.h/2);el('rect',{x:cx-4,y:cy-4,width:8,height:8,rx:.65,class:'shelter'});el('rect',{x:cx-3.55,y:cy-3.6,width:7.1,height:.65,rx:.25,fill:'#294557'});const message=el('text',{x:cx,y:cy-3.16,'text-anchor':'middle',fill:'#edf5ff','font-size':'.37','font-weight':'600'});message.textContent='Help me escape!';el('ellipse',{cx,cy:cy+2.25,rx:3,ry:.46,fill:'#123e50',stroke:'#267085','stroke-width':'.07'});
const frame=el('svg',{id:'person-frame',x:cx-2.0,y:cy-2.9,width:4,height:5.25,preserveAspectRatio:'xMidYMax meet',class:'person'});el('image',{href:atlas,width:__ATLAS_WIDTH__,height:__ATLAS_HEIGHT__},frame);
el('rect',{x:cx-3.05,y:cy+3.1,width:6.1,height:.12,rx:.06,fill:'#2d4558'});el('rect',{id:'progress-fill',x:cx-3.05,y:cy+3.1,width:0,height:.12,rx:.06,fill:'#ffd258'});el('text',{id:'progress-label',x:cx,y:cy+3.58,'text-anchor':'middle',fill:'#c3d2e9','font-size':'.28'});update();expression(0);status.textContent='Tap an arrow with a clear escape path.';
}
root.querySelector('#hint').addEventListener('click',()=>{if(hintUsed)return;const p=active.find(clear);if(!p)return;hintUsed=true;root.querySelector('#hint').disabled=true;root.querySelector('#hint').textContent='Hint · 0';p.element.classList.add('hint');status.textContent='The highlighted arrow has a clear path.';});
root.querySelector('#restart').addEventListener('click',load);root.querySelector('#next').addEventListener('click',()=>{index=(index+1)%levels.length;load();});load();
})();
</script></body></html>
