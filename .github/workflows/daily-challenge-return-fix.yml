name: Arrow Escape 1.0.7 Daily Challenge Fix Build

on:
  push:
    branches:
      - daily-challenge-return-fix
    paths:
      - app/**
      - scripts/**
      - .github/workflows/daily-challenge-return-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify data and UI contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "1.0.7"' app/build.gradle.kts
          grep -q 'currentLevelNumber(){return challengeActive()?' app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          grep -q 'if(challengeActive())exitChallengeToCampaign();' app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          grep -q 'DAILY CHALLENGE #"+game.dailyPuzzleNumber()' app/src/main/java/com/arrowescape/pro/MainActivity.java

      - name: Compile app, tests and release bundle
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleAndroidTest :app:bundleRelease --stacktrace

      - name: Package build
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$AAB"
          test -s "$APK"
          test -s "$TEST_APK"
          unzip -t "$AAB" >/dev/null
          mkdir -p dist
          cp "$AAB" dist/Arrow-Escape-1.0.7-DAILY-RETURN-UNSIGNED.aab
          cp "$APK" dist/Arrow-Escape-1.0.7-DEBUG.apk
          sha256sum dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.7-Daily-Challenge-Fix
          path: dist/
          if-no-files-found: error
          retention-days: 7
