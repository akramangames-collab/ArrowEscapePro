name: Arrow Escape V55 Redesign Review
on:
  push:
    branches: [redesign/premium-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arrow-v55-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARROW_RELEASE_STORE_FILE: ${{ github.workspace }}/../arrow-original-upload.jks
      ARROW_RELEASE_STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
      ARROW_RELEASE_KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
      ARROW_RELEASE_KEY_ALIAS: arrowescape-upload
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore original signing key if configured
        id: signing
        env:
          KEY_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$ARROW_RELEASE_STORE_PASSWORD" ] || [ -z "$ARROW_RELEASE_KEY_PASSWORD" ]; then
            echo "Original signing secrets unavailable. Only preview-package debug APK may be delivered."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$ARROW_RELEASE_STORE_FILE"
          CERT=$(keytool -list -v -keystore "$ARROW_RELEASE_STORE_FILE" -storepass:env ARROW_RELEASE_STORE_PASSWORD -alias "$ARROW_RELEASE_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "c0f5b84b375b4775bcc67c37e057a26cb3d654fe7938d48b658eb423e441429f"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify complete campaign and wallet
        run: |
          set -euo pipefail
          mkdir -p review
          python3 scripts/verify-levels.py | tee review/campaign-verification.txt
          bash scripts/test-wallet.sh | tee review/wallet-verification.txt
          python3 scripts/generate-daily-challenges.py --check | tee review/daily-verification.txt
          git ls-files -z app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties | xargs -0 sha256sum > review/runtime-inputs.sha256
      - name: Build and test frozen source
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --max-workers=4 :app:testDebugUnitTest :app:testReleaseUnitTest --tests com.arrowescape.pro.StartupRuntimeTest :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease
          sha256sum -c review/runtime-inputs.sha256 > review/runtime-inputs-verified.txt
      - name: Collect verified review artifacts
        env:
          ORIGINAL_SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk review/Arrow-Escape-V55-PREVIEW-TEST.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose review/Arrow-Escape-V55-PREVIEW-TEST.apk > review/debug-signature.txt
          "$BT/aapt2" dump badging review/Arrow-Escape-V55-PREVIEW-TEST.apk | sed -n '1p' > review/debug-package.txt
          grep -F "name='com.arrowescape.pro.preview' versionCode='55'" review/debug-package.txt
          if [ "$ORIGINAL_SIGNING_READY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk review/Arrow-Escape-V55-REDESIGN-REVIEW.apk
            cp app/build/outputs/bundle/release/app-release.aab review/Arrow-Escape-V55-REDESIGN-REVIEW.aab
            "$BT/apksigner" verify --verbose --print-certs review/Arrow-Escape-V55-REDESIGN-REVIEW.apk > review/release-signature.txt
            grep -i 'c0f5b84b375b4775bcc67c37e057a26cb3d654fe7938d48b658eb423e441429f' review/release-signature.txt
            jarsigner -verify review/Arrow-Escape-V55-REDESIGN-REVIEW.aab > review/bundle-signature.txt
            grep -F 'jar verified' review/bundle-signature.txt
            keytool -printcert -jarfile review/Arrow-Escape-V55-REDESIGN-REVIEW.aab > review/bundle-certificate.txt
            tr -d ':' < review/bundle-certificate.txt | grep -i 'c0f5b84b375b4775bcc67c37e057a26cb3d654fe7938d48b658eb423e441429f'
            "$BT/aapt2" dump badging review/Arrow-Escape-V55-REDESIGN-REVIEW.apk | sed -n '1p' > review/release-package.txt
            grep -F "name='com.arrowescape.pro' versionCode='55'" review/release-package.txt
          fi
          cp -r app/build/approved-ui-previews review/native-ui-previews
          cp -r app/build/game-previews review/native-game-previews
          cp PREMIUM-V2-STATUS.md design/REDESIGN-V55.md review/
          cd review
          sha256sum *.apk > SHA256SUMS.txt
          if ls *.aab >/dev/null 2>&1; then sha256sum *.aab >> SHA256SUMS.txt; fi
      - name: Retain reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-V55-Reports
          path: |
            app/build/reports/
            app/build/test-results/
            review/*.txt
            review/*.sha256
          retention-days: 30
      - name: Retain successful review build
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-V55-Review
          path: review/
          retention-days: 30
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -f "$ARROW_RELEASE_STORE_FILE"
