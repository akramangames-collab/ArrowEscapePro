name: Production Ads R8 Build

on:
  push:
    branches:
      - ads-r8-production-patch
    paths:
      - .github/workflows/ads-r8-production-patch.yml
      - .github/scripts/apply_ads_r8_patch.py

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preserve patch script and switch to main
        shell: bash
        run: |
          cp .github/scripts/apply_ads_r8_patch.py /tmp/apply_ads_r8_patch.py
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply production ads and R8 patch
        run: python3 /tmp/apply_ads_r8_patch.py

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "1.0.3"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'showResultBanner' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'addMenuBanner(body)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -q 'ca-app-pub-3940256099942544' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/6590130477' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/3782285105' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/2469203439' app/build.gradle.kts
          git diff --check

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "akramangames-collab"
          git config user.email "akramangames@gmail.com"
          git add app/build.gradle.kts app/proguard-rules.pro app/src/main/java/com/arrowescape/pro/MainActivity.java
          git commit -m "Enable R8 and production ad placements"
          git push origin HEAD:main

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify gameplay and economy
        shell: bash
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Build optimized release AAB
        shell: bash
        run: |
          gradle :app:lintRelease :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload optimized release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.3-Code5-R8-UNSIGNED
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 1
