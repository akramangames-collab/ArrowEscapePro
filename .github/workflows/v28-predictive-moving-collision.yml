name: Predictive Moving Collision Repair

on:
  push:
    branches: [v23-upload-ready-nightly]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[predictive-collision-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Apply predictive collision rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          helper=base64.b64decode('').decode()
          new_loop=base64.b64decode('').decode()
          src=Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          s=src.read_text(); marker='    private boolean isClear(Piece target) {'
          if 'private boolean willCollideWithMoving(' not in s: s=s.replace(marker,helper+marker,1)
          a=s.index('        for (Piece p : pieces) {',s.index(marker)); b=s.index('\n        Point tip =',a)
          s=s[:a]+new_loop+s[b:]; src.write_text(s)

          test=Path('app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java'); t=test.read_text()
          old=base64.b64decode('ICAgICAgICAgICAgc2V0KGJsb2NrZXIsIm1vdmluZyIsdHJ1ZSk7YXNzZXJ0RmFsc2UoIk1vdmluZyB0YWlscyBzdGlsbCByZXNlcnZlIHRoZWlyIGVzY2FwZSIsY2xlYXIoZyx0YXJnZXQpKTs=').decode()
          new=base64.b64decode('').decode()
          anchor=base64.b64decode('ICAgICAgICAgICAgT2JqZWN0IGJlbnQ9cGllY2UoZywwLDAsMCw0LDQsNCk7').decode()
          collision=base64.b64decode('').decode()
          if old not in t: raise SystemExit('old V17 assertion missing')
          if anchor not in t: raise SystemExit('V17 anchor missing')
          t=t.replace(old,new,1).replace(anchor,collision+anchor,1); test.write_text(t)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java
          git rm .github/workflows/v28-predictive-moving-collision.yml .github/workflows/v29-predictive-moving-collision.yml || true
          git commit -m "Check real moving-arrow collisions without reserving lanes"
          git push origin HEAD:v23-upload-ready-nightly
