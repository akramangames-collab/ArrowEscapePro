name: Arrow Escape 1.1.1 Live Release APK

on:
  push:
    branches:
      - live-apk-v111
    paths:
      - .github/workflows/live-apk-v111.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify live release configuration
        run: |
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "1.1.1"' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787~6197424406' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/6590130477' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/3782285105' app/build.gradle.kts
          grep -q 'ca-app-pub-2475015099415787/2469203439' app/build.gradle.kts
          grep -q 'MAX_AD_CONTENT_RATING_G' app/src/main/java/com/arrowescape/pro/MainActivity.java

      - name: Build release APK with live AdMob IDs
        run: gradle :app:assembleRelease --stacktrace

      - name: Package unsigned release APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ArrowEscape-v1.1.1-LIVE-RELEASE-UNSIGNED.apk
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/lib/apksigner.jar dist/apksigner.jar
          cp /usr/local/lib/android/sdk/build-tools/36.0.0/zipalign dist/zipalign
          chmod +x dist/zipalign
          sha256sum dist/ArrowEscape-v1.1.1-LIVE-RELEASE-UNSIGNED.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-v1.1.1-LIVE-RELEASE-UNSIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 7
