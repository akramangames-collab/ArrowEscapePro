name: Build Arrow Escape 1.0.2 AAB
on:
  push:
    branches: [v25-version-1.0.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Play Store AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Verify version, SDK and package bundle
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 3' app/build.gradle.kts
          grep -q 'versionName = "1.0.2"' app/build.gradle.kts
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/Arrow-Escape-1.0.2-SDK36.aab
          sha256sum dist/Arrow-Escape-1.0.2-SDK36.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.2-SDK36-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
