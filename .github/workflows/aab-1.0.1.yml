name: Arrow Escape 1.1.5 Signed Play Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - scripts/**
      - .github/workflows/aab-1.0.1.yml

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Require existing release-key secrets
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ARROW_RELEASE_KEYSTORE_B64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ARROW_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ARROW_RELEASE_KEY_PASSWORD'; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/arrow-release.jks"
          test -s "$RUNNER_TEMP/arrow-release.jks"
          chmod 600 "$RUNNER_TEMP/arrow-release.jks"

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/generate-daily-challenges.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Build signed Play Store AAB
        env:
          ARROW_RELEASE_STORE_FILE: ${{ runner.temp }}/arrow-release.jks
          ARROW_RELEASE_STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          ARROW_RELEASE_KEY_ALIAS: arrowescape-upload
          ARROW_RELEASE_KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Verify signed bundle and metadata
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          EXPECTED_UPLOAD_SHA256="C0:F5:B8:4B:37:5B:47:75:BC:C6:7C:37:E0:57:A2:6C:B3:D6:54:FE:79:38:D4:8B:65:8E:B4:23:E4:41:42:9F"
          test -f "$AAB"
          grep -q 'version = release(36)' app/build.gradle.kts
          grep -q 'minorApiLevel = 1' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "1.1.5"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'androidx.activity:activity:1.13.0' app/build.gradle.kts
          grep -q 'androidx.core:core:1.18.0' app/build.gradle.kts
          grep -q 'androidx.fragment:fragment:1.9.1' app/build.gradle.kts
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -R 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES' app/src/main/java app/src/main/res
          ! grep -R -E 'BitmapFactory\.decodeStream|URLConnection\.getInputStream|java\.net\.URLConnection' app/src/main/java
          ! grep -R -E 'setStatusBarColor\(|setNavigationBarColor\(|setSystemUiVisibility\(' app/src/main/java
          ! grep -R 'android:screenOrientation=' app/src/main/AndroidManifest.xml
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -Fq "SHA256: $EXPECTED_UPLOAD_SHA256"
          mkdir -p dist
          cp "$AAB" dist/PLAY-STORE-Arrow-Escape-1.1.5-v17-SDK36.1-SIGNED.aab
          sha256sum dist/PLAY-STORE-Arrow-Escape-1.1.5-v17-SDK36.1-SIGNED.aab > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.1.5-v17-SIGNED-PLAY-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
