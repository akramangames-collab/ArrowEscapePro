name: Arrow Escape 1.1.7 Play Warning Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - scripts/**
      - .github/workflows/aab-1.0.1.yml

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/generate-daily-challenges.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Verify Play recommendation fixes
        run: |
          grep -q 'version = release(36)' app/build.gradle.kts
          grep -q 'minorApiLevel = 1' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 19' app/build.gradle.kts
          grep -q 'versionName = "1.1.7"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'androidx.activity:activity:1.13.0' app/build.gradle.kts
          grep -q 'androidx.core:core:1.18.0' app/build.gradle.kts
          grep -q 'androidx.fragment:fragment:1.9.1' app/build.gradle.kts
          ! grep -R -E 'WindowCompat\.enableEdgeToEdge|WindowCompat\.setDecorFitsSystemWindows|setStatusBarColor\(|setNavigationBarColor\(' app/src/main/java
          grep -q 'ads-mobile-sdk:1.5.0' app/build.gradle.kts
          grep -q 'com.google.android.play:hsdp:2.1.0' app/build.gradle.kts
          ! grep -q 'play-services-ads:25.5.0' app/build.gradle.kts
          ! grep -q 'com.google.android.play:hsdp' app/build.gradle.kts
          ! grep -R 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES' app/src/main/java app/src/main/res
          ! grep -R -E 'BitmapFactory\.decodeStream|URLConnection\.getInputStream|java\.net\.URLConnection' app/src/main/java
          ! grep -R -E 'setStatusBarColor\(|setNavigationBarColor\(|setSystemUiVisibility\(' app/src/main/java
          ! grep -R 'android:screenOrientation=' app/src/main/AndroidManifest.xml

      - name: Build lint and release bundle
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Package unsigned AAB for local upload-key signing
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/root/hsdp.properties | grep -q 'version=2.1.0'
          mkdir -p dist
          cp "$AAB" dist/Arrow-Escape-1.1.7-v19-UNSIGNED.aab
          sha256sum dist/Arrow-Escape-1.1.7-v19-UNSIGNED.aab > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.1.7-v19-UNSIGNED-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 7
