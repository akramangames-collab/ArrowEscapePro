name: Arrow Escape 1.0.6 Families Policy Build

on:
  workflow_dispatch:
  push:
    branches:
      - families-ad-policy-hotfix
    paths:
      - app/**
      - scripts/**
      - .github/workflows/aab-1.0.1.yml

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "1.0.6"' app/build.gradle.kts
          grep -q 'configureFamiliesAdPolicy();' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'MAX_AD_CONTENT_RATING_G' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'TAG_FOR_CHILD_DIRECTED_TREATMENT_TRUE' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'TAG_FOR_UNDER_AGE_OF_CONSENT_TRUE' app/src/main/java/com/arrowescape/pro/MainActivity.java

      - name: Build release AAB
        run: gradle :app:lintDebug :app:bundleRelease --stacktrace

      - name: Verify and package unsigned bundle
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          mkdir -p dist
          cp "$AAB" dist/Arrow-Escape-1.0.6-FAMILIES-POLICY-UNSIGNED.aab
          sha256sum dist/Arrow-Escape-1.0.6-FAMILIES-POLICY-UNSIGNED.aab > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.6-FAMILIES-POLICY-UNSIGNED-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 7
