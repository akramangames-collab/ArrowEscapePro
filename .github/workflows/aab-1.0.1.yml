name: Arrow Escape 1.2.0 Stable Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - scripts/**
      - .github/workflows/aab-1.0.1.yml

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/generate-daily-challenges.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py
          javac -d build/wallet-tests app/src/main/java/com/arrowescape/pro/BoosterGeometry.java tests/CampaignBoosterTest.java -cp build/wallet-tests
          java -cp build/wallet-tests CampaignBoosterTest

      - name: Verify Play recommendation fixes
        run: |
          set -euo pipefail
          grep -q 'version = release(36)' app/build.gradle.kts
          grep -q 'minorApiLevel = 1' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "1.2.0"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'ignoreFrom("com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk")' app/build.gradle.kts
          grep -q '"ads-r8-functional-rules.pro"' app/build.gradle.kts
          grep -q 'androidx.activity:activity:1.13.0' app/build.gradle.kts
          grep -q 'androidx.core:core:1.18.0' app/build.gradle.kts
          grep -q 'androidx.fragment:fragment:1.9.1' app/build.gradle.kts
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'ads-mobile-sdk:1.5.0' app/build.gradle.kts
          grep -q 'com.google.android.play:hsdp:2.2.0' app/build.gradle.kts
          if grep -R -E 'WindowCompat\.enableEdgeToEdge|setStatusBarColor\(|setNavigationBarColor\(|setSystemUiVisibility\(' app/src/main/java; then
            echo "ERROR: app source contains deprecated edge-to-edge APIs"; exit 1
          fi
          if grep -R 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES' app/src/main/java app/src/main/res; then
            echo "ERROR: app source contains SHORT_EDGES"; exit 1
          fi
          if grep -R -E 'BitmapFactory\.decodeStream|URLConnection\.getInputStream|java\.net\.URLConnection' app/src/main/java; then
            echo "ERROR: app source contains legacy bitmap/network path"; exit 1
          fi
          if grep -q 'android:screenOrientation=' app/src/main/AndroidManifest.xml; then
            echo "ERROR: fixed screen orientation is still declared"; exit 1
          fi

      - name: Build lint and release bundle
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --stacktrace

      - name: Package unsigned AAB for local upload-key signing
        run: |
          set -euo pipefail
          RAW_AAB="app/build/outputs/bundle/release/app-release.aab"
          OUT_AAB="dist/Arrow-Escape-1.2.0-v28-UNSIGNED.aab"
          test -s "$RAW_AAB"
          unzip -t "$RAW_AAB" >/dev/null
          unzip -p "$RAW_AAB" BUNDLE-METADATA/com.android.tools/r8.json > /tmp/r8.json
          python3 -c "import json; r=json.load(open('/tmp/r8.json')); print('R8 stats:', r.get('stats',{})); o=r.get('options',{}); s=r.get('stats',{}); assert o.get('isObfuscationEnabled') is True and o.get('isOptimizationsEnabled') is True and o.get('isShrinkingEnabled') is True; assert float(s.get('noObfuscationPercentage',100)) < 50, s"
          if grep -q 'Keep the names of already obfuscated Google Mobile Ads code' app/build/outputs/mapping/release/configuration.txt; then
            echo "ERROR: broad GMA no-obfuscation rule returned"; exit 1
          fi
          mkdir -p dist
          WINDOW_API_SCAN_OUT=dist/deprecated-window-api-inputs.json python3 scripts/scan-deprecated-window-apis.py
          gradle :app:dependencies --configuration releaseRuntimeClasspath > dist/releaseRuntimeClasspath.txt
          grep -q 'com.google.android.play:hsdp:2.2.0' dist/releaseRuntimeClasspath.txt
          cp "$RAW_AAB" "$OUT_AAB"
          unzip -t "$OUT_AAB" >/dev/null
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          cp app/build/outputs/mapping/release/configuration.txt dist/r8-configuration.txt
          cp app/build/outputs/mapping/release/usage.txt dist/r8-usage.txt || true
          printf '%s\n' \
            'Arrow Escape app-owned code does not use SHORT_EDGES, deprecated status/navigation' \
            'bar color APIs, or the legacy bitmap/network path. GMA Next-Gen 1.5.0 currently' \
            'depends on Google Play HSDP 2.2.0; HsdpShimActivity in that Google dependency' \
            'contains SHORT_EDGES. Removing or stubbing HSDP breaks GMA references, so the' \
            'vendor dependency is intentionally left intact until Google publishes a fixed SDK.' \
            > dist/PLAY-WARNING-NOTE.txt
          sha256sum "$OUT_AAB" > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.2.0-v28-UNSIGNED-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 7
