name: Arrow Escape current screenshot capture

on:
  push:
    branches:
      - build-latest-package

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build current debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Capture real current-build screenshots
        timeout-minutes: 9
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: false
          script: |
            mkdir -p dist
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.arrowescape.pro.debug -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > dist/01-latest-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET, subprocess
            root=ET.parse('window.xml').getroot()
            candidates=[]
            for node in root.iter('node'):
                text=(node.attrib.get('text') or '').upper()
                if 'PLAY' in text and 'DAILY' not in text:
                    candidates.append(node)
            if candidates:
                m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', candidates[0].attrib.get('bounds',''))
                if m:
                    x1,y1,x2,y2=map(int,m.groups())
                    subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
            PY
            sleep 4
            adb exec-out screencap -p > dist/02-latest-gameplay.png
            test -s dist/01-latest-home.png
            test -s dist/02-latest-gameplay.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-Current-Real-Screenshots
          path: dist/*.png
          if-no-files-found: error
          retention-days: 7
