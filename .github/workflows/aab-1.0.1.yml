name: Arrow Escape 1.0.5 Build Verification

on:
  push:
    branches:
      - build/arrow-escape-1.0.5
    paths:
      - .github/workflows/aab-1.0.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v105:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Verify Play compatibility fixes
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 7' app/build.gradle.kts
          grep -q 'versionName = "1.0.5"' app/build.gradle.kts
          grep -q 'androidx.activity:activity:1.13.0' app/build.gradle.kts
          grep -q 'androidx.fragment:fragment:1.9.1' app/build.gradle.kts
          grep -q 'WindowCompat.enableEdgeToEdge' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -R -E 'setStatusBarColor\(|setNavigationBarColor\(|setSystemUiVisibility\(' app/src/main/java
          ! grep -R 'android:screenOrientation=' app/src/main/AndroidManifest.xml

      - name: Build debug APK and unsigned release AAB
        run: gradle :app:lintDebug :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Collect build outputs
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          mkdir -p dist
          cp "$APK" dist/Arrow-Escape-1.0.5-DEBUG.apk
          cp "$AAB" dist/Arrow-Escape-1.0.5-UNSIGNED.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.5-BUILD-VERIFICATION
          path: dist/
          if-no-files-found: error
          retention-days: 30
