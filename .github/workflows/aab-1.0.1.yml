name: Build Arrow Escape 1.0.1 AAB
on:
  push:
    branches: [v23-upload-ready-nightly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Play Store AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Verify version and package bundle
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "1.0.1"' app/build.gradle.kts
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/Arrow-Escape-1.0.1.aab
          sha256sum dist/Arrow-Escape-1.0.1.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.1-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
