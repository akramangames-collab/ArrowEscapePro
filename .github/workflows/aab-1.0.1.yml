name: Arrow Escape latest package capture

on:
  push:
    branches:
      - build-latest-package

permissions:
  contents: read

jobs:
  latest-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Build current-main unsigned AAB and debug APK
        run: gradle :app:lintDebug :app:bundleRelease :app:assembleDebug --stacktrace

      - name: Prepare package artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/Arrow-Escape-1.0.2-SDK36-LATEST-UNSIGNED.aab
          sha256sum dist/Arrow-Escape-1.0.2-SDK36-LATEST-UNSIGNED.aab > dist/UNSIGNED-SHA256.txt

      - name: Upload AAB immediately
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-Latest-AAB
          path: |
            dist/Arrow-Escape-1.0.2-SDK36-LATEST-UNSIGNED.aab
            dist/UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Capture real current-build screenshots
        timeout-minutes: 7
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.arrowescape.pro
            adb shell am start -W -n com.arrowescape.pro/.MainActivity
            sleep 3
            adb exec-out screencap -p > dist/01-latest-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET, subprocess
            root=ET.parse('window.xml').getroot()
            target=None
            for node in root.iter('node'):
                text=(node.attrib.get('text') or '').upper()
                if 'PLAY' in text and 'DAILY' not in text:
                    target=node
                    break
            if target is not None:
                m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', target.attrib.get('bounds',''))
                if m:
                    x1,y1,x2,y2=map(int,m.groups())
                    subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
            PY
            sleep 2
            adb exec-out screencap -p > dist/02-latest-gameplay.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-Latest-Screenshots
          path: dist/*.png
          if-no-files-found: ignore
          retention-days: 7
