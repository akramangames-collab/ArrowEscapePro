name: Arrow Escape 1.0.2 Signed Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Require existing release-key secrets
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARROW_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ARROW_RELEASE_KEYSTORE_B64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ARROW_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ARROW_RELEASE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ARROW_RELEASE_KEY_PASSWORD'; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/arrow-release.jks"
          test -s "$RUNNER_TEMP/arrow-release.jks"
          chmod 600 "$RUNNER_TEMP/arrow-release.jks"

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Build signed Play Store AAB
        env:
          ARROW_RELEASE_STORE_FILE: ${{ runner.temp }}/arrow-release.jks
          ARROW_RELEASE_STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          ARROW_RELEASE_KEY_ALIAS: ${{ secrets.ARROW_RELEASE_KEY_ALIAS }}
          ARROW_RELEASE_KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: gradle :app:lintDebug :app:bundleRelease --stacktrace

      - name: Verify signed bundle and metadata
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 3' app/build.gradle.kts
          grep -q 'versionName = "1.0.2"' app/build.gradle.kts
          jarsigner -verify -strict "$AAB"
          mkdir -p dist
          cp "$AAB" dist/PLAY-STORE-Arrow-Escape-1.0.2-SDK36-SIGNED.aab
          sha256sum dist/PLAY-STORE-Arrow-Escape-1.0.2-SDK36-SIGNED.aab > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.2-SIGNED-PLAY-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
