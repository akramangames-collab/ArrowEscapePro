name: Arrow Escape 1.0.5 Test Build

on:
  push:
    branches:
      - build/arrow-1.0.5
    paths:
      - app/**
      - scripts/**
      - .github/workflows/aab-1.0.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify source contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Build test APK and release bundle
        run: gradle :app:lintDebug :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Package artifacts
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"
          cp "$APK" dist/Arrow-Escape-1.0.5-TEST.apk
          cp "$AAB" dist/Arrow-Escape-1.0.5-UNSIGNED.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.5-TEST-BUILD
          path: dist/
          if-no-files-found: error
          retention-days: 30
