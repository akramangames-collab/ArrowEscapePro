name: Arrow Escape 1.0.3 Unsigned Bundle

on:
  push:
    branches:
      - release-1.0.3-unsigned-build
    paths:
      - .github/workflows/unsigned-1.0.3.yml
      - ci-trigger-unsigned-103.txt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate release version
        run: |
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "1.0.3"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Build unsigned release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Confirm bundle exists
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.3-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
