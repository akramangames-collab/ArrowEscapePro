name: Arrow Escape v43 Original Upload-Key Signed APK and AAB

on:
  push:
    branches:
      - feature/v28-400-level-trail-boosters
    paths:
      - .github/workflows/sign-v43-with-original-play-key.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check release-key secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Original upload keystore/password secrets are not all configured in GitHub Actions. Refusing to generate an incorrectly signed APK/AAB."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1 and Build Tools
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore original upload keystore to runner temp only
        env:
          KEYSTORE_B64: ${{ secrets.ARROW_RELEASE_KEYSTORE_B64 }}
          ARROW_RELEASE_STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          ARROW_RELEASE_KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/arrow-original-upload.jks"
          test -s "$RUNNER_TEMP/arrow-original-upload.jks"
          EXPECTED="C0F5B84B375B4775BCC67C37E057A26CB3D654FE7938D48B658EB423E441429F"
          CERT_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/arrow-original-upload.jks" -alias arrowescape_upload -storepass "$ARROW_RELEASE_STORE_PASSWORD" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$CERT_SHA256" != "$EXPECTED" ]; then
            echo "::error::Wrong keystore fingerprint. Refusing to sign."
            exit 1
          fi
          echo "Original Play upload certificate verified (SHA-256)."

      - name: Verify source, policy and compile signed APK and AAB
        env:
          ARROW_RELEASE_STORE_FILE: ${{ runner.temp }}/arrow-original-upload.jks
          ARROW_RELEASE_STORE_PASSWORD: ${{ secrets.ARROW_RELEASE_STORE_PASSWORD }}
          ARROW_RELEASE_KEY_ALIAS: arrowescape_upload
          ARROW_RELEASE_KEY_PASSWORD: ${{ secrets.ARROW_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 43' app/build.gradle.kts
          grep -Fq 'versionName = "1.4.3"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.arrowescape.pro"' app/build.gradle.kts
          grep -Fq 'play-services-ads:25.5.0' app/build.gradle.kts
          grep -Fq 'setTagForChildDirectedTreatment(RequestConfiguration.TAG_FOR_CHILD_DIRECTED_TREATMENT_TRUE)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/generate-daily-challenges.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify both original-key signatures and package identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"
          AAPT="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert-info.txt"
          jarsigner -verify -strict "$AAB" > "$RUNNER_TEMP/aab-verification.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert-info.txt"
          EXPECTED="C0F5B84B375B4775BCC67C37E057A26CB3D654FE7938D48B658EB423E441429F"
          APK_CERT="$(grep -im1 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-cert-info.txt" | sed 's/.*: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          AAB_CERT="$(grep -im1 'SHA256:' "$RUNNER_TEMP/aab-cert-info.txt" | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$APK_CERT" != "$EXPECTED" ] || [ "$AAB_CERT" != "$EXPECTED" ]; then
            echo "::error::APK/AAB not signed by the expected original Play upload certificate."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep -Eq "^package: name='com.arrowescape.pro' versionCode='43' versionName='1.4.3'"
          unzip -t "$AAB" >/dev/null
          mkdir -p dist
          cp "$APK" "dist/Arrow-Escape-1.4.3-v43-ORIGINAL-KEY-SIGNED.apk"
          cp "$AAB" "dist/Arrow-Escape-1.4.3-v43-ORIGINAL-KEY-SIGNED.aab"
          sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt
          printf '%s\n' \
            'Both artifacts signed with the original Google Play UPLOAD KEY (SHA-256 C0:F5:B8:4B:37:5B:47:75:BC:C6:7C:37:E0:57:A2:6C:B3:D6:54:FE:79:38:D4:8B:65:8E:B4:23:E4:41:42:9F).' \
            'Release package: com.arrowescape.pro; version 1.4.3 / code 43.' \
            'Do not upload until AdMob sensitive-category blocks and Play Data Safety/Target Audience are checked.' \
            'A Play-installed app may be signed using the separate Play app-signing certificate and not accept sideloaded upload-key APK updates.' \
            > dist/README-SIGNED-BUILDS.txt
          echo "SIGNED_APK_AND_AAB_WITH_ORIGINAL_CERT_VERIFIED"

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-v43-Original-Key-Signed-APK-AAB
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Remove keystore from runner temp
        if: always()
        run: rm -f "$RUNNER_TEMP/arrow-original-upload.jks"
