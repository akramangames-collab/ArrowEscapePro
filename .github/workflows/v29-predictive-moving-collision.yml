name: Corrected Predictive Moving Collision Repair

on:
  push:
    branches: [v23-upload-ready-nightly]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[predictive-collision-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Apply predictive collision rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          helper=base64.b64decode('').decode()
          old_loop=base64.b64decode('').decode()
          new_loop=base64.b64decode('').decode()

          src=Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          s=src.read_text()
          marker='    private boolean isClear(Piece target) {'
          if 'private boolean willCollideWithMoving(' not in s:
              if marker not in s: raise SystemExit('isClear marker missing')
              s=s.replace(marker,helper+marker,1)
          if old_loop not in s: raise SystemExit('current moving-arrow loop missing')
          src.write_text(s.replace(old_loop,new_loop,1))

          test=Path('app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java')
          t=test.read_text()
          old_line='            set(blocker,"moving",true);assertFalse("Moving tails still reserve their escape",clear(g,target));'
          new_lines='''            int blockerSteps=(Integer)call(g,"snakeTravelSteps",new Class[]{blocker.getClass()},blocker);
            set(blocker,"moving",true);set(blocker,"moveSteps",blockerSteps);set(blocker,"moveT",0f);
            assertTrue("A moving arrow must not reserve a lane when its future motion will not collide",clear(g,target));'''
          if old_line not in t: raise SystemExit('old moving blocker assertion missing')
          t=t.replace(old_line,new_lines,1)
          anchor='            Object bent=piece(g,0,0,0,4,4,4);'
          collision_test='''            Object crossingTarget=piece(g,0,10,2,10),crossing=piece(g,4,4,4,10);
            pieces(g).clear();pieces(g).add(crossingTarget);pieces(g).add(crossing);
            int crossingSteps=(Integer)call(g,"snakeTravelSteps",new Class[]{crossing.getClass()},crossing);
            set(crossing,"moving",true);set(crossing,"moveSteps",crossingSteps);set(crossing,"moveT",0f);
            assertFalse("A moving arrow must still block when live future snake bodies actually collide",clear(g,crossingTarget));

'''
          if anchor not in t: raise SystemExit('bent test anchor missing')
          test.write_text(t.replace(anchor,collision_test+anchor,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile app and instrumentation tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Commit predictive collision implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java
          git rm .github/workflows/v29-predictive-moving-collision.yml .github/workflows/v28-predictive-moving-collision.yml || true
          git commit -m "Check real moving-arrow collisions without reserving lanes"
          git push origin HEAD:v23-upload-ready-nightly
