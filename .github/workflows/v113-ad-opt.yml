name: Arrow Escape 1.1.3 Ad Optimized Build

on:
  push:
    branches:
      - ad-layout-interstitial-v113
    paths:
      - app/**
      - .github/workflows/v113-ad-opt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify ad optimization
        run: |
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "1.1.3"' app/build.gradle.kts
          grep -q 'INTERSTITIAL_EVERY_LEVELS = 2' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'setMenuBannerSpace' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'private TextView navButton' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'slot.setVisibility(View.INVISIBLE)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -q 'completedSinceAd < 5' app/src/main/java/com/arrowescape/pro/MainActivity.java
      - name: Build release APK and AAB
        run: gradle :app:lintDebug :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Package
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          mkdir -p dist
          cp "$APK" dist/ArrowEscape-v1.1.3-AD-OPTIMIZED-UNSIGNED.apk
          cp "$AAB" dist/ArrowEscape-v1.1.3-AD-OPTIMIZED-UNSIGNED.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-v1.1.3-Ad-Optimized
          path: dist/
          if-no-files-found: error
          retention-days: 7
