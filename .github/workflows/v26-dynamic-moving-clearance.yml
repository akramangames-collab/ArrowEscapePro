name: Dynamic Moving Clearance Repair
on:
  push:
    branches:
      - v23-upload-ready-nightly
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-dynamic-moving-clearance.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java
          git rm .github/workflows/v26-dynamic-moving-clearance.yml scripts/patch-dynamic-moving-clearance.py
          git commit -m "Use live moving-body geometry for arrow clearance"
          git push origin HEAD:v23-upload-ready-nightly
