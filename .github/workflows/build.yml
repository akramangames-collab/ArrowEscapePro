name: Build Arrow Escape Pro V9-V15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # RECOVER THE WORKING V8 PROJECT
      # ============================================================

      - name: Recover working V8 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            ArrowMazeFaithfulV8 \
            ArrowMazeFaithfulV9 \
            ArrowMazeFaithfulV10 \
            ArrowMazeFaithfulV11 \
            ArrowMazeFaithfulV12 \
            ArrowMazeFaithfulV13 \
            ArrowMazeFaithfulV14 \
            ArrowMazeFaithfulV15 \
            ArrowMazeDenseV5 \
            /tmp/v8patch

          mkdir -p /tmp/v8patch

          git show \
            d75a5cf10678c316bf8719a9f0762f71d1ca5d9a:.github/workflows/build.yml \
            > /tmp/v6-success.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import base64

          text = Path(
              "/tmp/v6-success.yml"
          ).read_text()

          match = re.search(
              r"echo '([^']+)' \| base64 -d > /tmp/v6payload\.tar\.xz",
              text
          )

          if not match:
              raise SystemExit(
                  "Could not recover V6 payload"
              )

          payload = base64.b64decode(
              match.group(1)
          )

          Path(
              "/tmp/v6payload.tar.xz"
          ).write_bytes(
              payload
          )

          print(
              "Recovered V6 payload:",
              len(payload),
              "bytes"
          )
          PY

          tar -xJf \
            /tmp/v6payload.tar.xz \
            -C /tmp/v8patch

          unzip -q \
            ArrowMazeDenseV5-Source.zip

          mv \
            ArrowMazeDenseV5 \
            ArrowMazeFaithfulV8



          cp \
            /tmp/v8patch/filter_levels_v6.py \
            /tmp/filter_levels_v8.py

          sed -i \
            's/ArrowMazeFaithfulV6/ArrowMazeFaithfulV8/g' \
            /tmp/filter_levels_v8.py

          python3 \
            /tmp/filter_levels_v8.py

          # Recover the exact successful V8
          # snake/path-following escape patch.

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          old = subprocess.check_output(
              [
                  "git",
                  "show",
                  "07aff3ffb0c113ab6da2dc5c37cb9f920b653083:.github/workflows/build.yml"
              ],
              text=True
          )

          blocks = re.findall(
              r"          python3 - <<'PY'\n(.*?)\n          PY",
              old,
              re.S
          )

          if len(blocks) < 2:
              raise SystemExit(
                  "Could not recover V8 patch"
              )

          lines = []

          for line in blocks[1].splitlines():

              if line.startswith(
                  "          "
              ):
                  line = line[10:]

              lines.append(
                  line
              )

          script = (
              "\n".join(lines)
              + "\n"
          )

          Path(
              "/tmp/v8_patch.py"
          ).write_text(
              script
          )

          print(
              "Recovered V8 patch:",
              len(script),
              "characters"
          )
          PY

          python3 \
            /tmp/v8_patch.py

          echo "V8 snake gameplay recovered"

      # ============================================================
      # GENERATE V9 THROUGH V15
      # ============================================================

      - name: Generate V9 to V15 projects
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/make_versions.py <<'PY'
          from pathlib import Path
          import shutil
          import re
          import json

          BASE = Path(
              "ArrowMazeFaithfulV8"
          )

          if not BASE.exists():
              raise SystemExit(
                  "Working V8 project missing"
              )

          # --------------------------------------------------------
          # HELPERS
          # --------------------------------------------------------

          def set_version(root, version):

              gradle = (
                  root /
                  "app/build.gradle.kts"
              )

              text = gradle.read_text()

              text = re.sub(
                  r"versionCode\s*=\s*\d+",
                  f"versionCode = {version + 1}",
                  text,
                  count=1
              )

              text = re.sub(
                  r'versionName\s*=\s*"[^"]+"',
                  f'versionName = "{version}.0.0"',
                  text,
                  count=1
              )

              gradle.write_text(
                  text
              )


          def set_label(root):

              manifest = (
                  root /
                  "app/src/main/AndroidManifest.xml"
              )

              text = manifest.read_text()

              text = re.sub(
                  r'android:label="[^"]+"',
                  'android:label="Arrow Escape Pro"',
                  text,
                  count=1
              )

              manifest.write_text(
                  text
              )


          def patch_v9_gameplay(root):

              game = (
                  root /
                  "app/src/main/java/com/arrowescape/pro/ArrowGameView.java"
              )

              text = game.read_text()

              # Slightly smoother V8 snake movement.
              # Keep the exact approved snake behaviour.

              text = text.replace(
                  "Math.max(getWidth() * 1.45f, cell * 10f)",
                  "Math.max(getWidth() * 1.30f, cell * 9f)"
              )

              text = text.replace(
                  "Math.min(1.25f,",
                  "Math.min(1.45f,"
              )

              # Correct move haptic feedback.

              marker = (
                  "if(isClear(p)){"
              )

              haptic = (
                  " performHapticFeedback("
                  "android.view."
                  "HapticFeedbackConstants."
                  "KEYBOARD_TAP);"
              )

              if (
                  marker in text
                  and
                  "HapticFeedbackConstants.KEYBOARD_TAP"
                  not in text
              ):
                  text = text.replace(
                      marker,
                      marker + haptic,
                      1
                  )

              game.write_text(
                  text
              )

              print(
                  "V9 gameplay polish applied"
              )


          def improve_level_order(root):

              levels = (
                  root /
                  "app/src/main/assets/levels.txt"
              )

              raw = [
                  line
                  for line
                  in levels.read_text().splitlines()
                  if line.strip()
              ]

              if len(raw) != 200:
                  raise SystemExit(
                      f"Expected 200 levels, got {len(raw)}"
                  )

              def payload(line):

                  if "|" not in line:
                      return line

                  return line.split(
                      "|",
                      1
                  )[1]


              def count(line):

                  data = payload(
                      line
                  )

                  return len(
                      [
                          piece
                          for piece
                          in data.split(";")
                          if piece.strip()
                      ]
                  )


              indexed = list(
                  enumerate(raw)
              )

              indexed.sort(
                  key=lambda item: (
                      count(item[1]),
                      item[0]
                  )
              )

              output = []

              for number, item in enumerate(
                  indexed,
                  start=1
              ):

                  data = payload(
                      item[1]
                  )

                  output.append(
                      f"{number}|{data}"
                  )


              counts = [
                  count(line)
                  for line
                  in output
              ]

              if counts != sorted(
                  counts
              ):
                  raise SystemExit(
                      "Difficulty sorting failed"
                  )

              levels.write_text(
                  "\n".join(output)
                  + "\n"
              )

              print(
                  "V10 difficulty:",
                  counts[0],
                  "->",
                  counts[-1],
                  "arrows"
              )


          def configure_application(root):

              manifest = (
                  root /
                  "app/src/main/AndroidManifest.xml"
              )

              text = manifest.read_text()

              if (
                  'android:name=".PremiumApplication"'
                  in text
              ):
                  return

              application_match = re.search(
                  r"<application\b[^>]*>",
                  text,
                  re.S
              )

              if not application_match:
                  raise SystemExit(
                      "Application tag missing"
                  )

              tag = application_match.group(
                  0
              )

              # Only add our Application class if
              # the project does not already use one.

              if "android:name=" not in tag:

                  new_tag = tag.replace(
                      "<application",
                      '<application android:name=".PremiumApplication"',
                      1
                  )

                  text = text.replace(
                      tag,
                      new_tag,
                      1
                  )

                  manifest.write_text(
                      text
                  )


          def premium_application(feature):

            template = r'''
          package com.arrowescape.pro;

          import android.app.Application;
          import android.app.Activity;
          import android.app.AlertDialog;

          import android.os.Bundle;
          import android.os.Build;

          import android.content.Context;
          import android.content.SharedPreferences;

          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;

          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;

          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class PremiumApplication
                  extends Application
                  implements Application.ActivityLifecycleCallbacks {{

              private static final int FEATURE =
                      {feature};

              private static final String PREF =
                      "arrow_escape_pro";

              @Override
              public void onCreate() {{

                  super.onCreate();

                  registerActivityLifecycleCallbacks(
                          this
                  );
              }}


              private SharedPreferences prefs() {{

                  return getSharedPreferences(
                          PREF,
                          MODE_PRIVATE
                  );
              }}


              private int dp(
                      Context context,
                      int value
              ) {{

                  return Math.round(
                          value *
                          context
                              .getResources()
                              .getDisplayMetrics()
                              .density
                  );
              }}


              private GradientDrawable background(
                      int color,
                      float radius
              ) {{

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(
                          color
                  );

                  drawable.setCornerRadius(
                          radius
                  );

                  return drawable;
              }}


              private void polishBars(
                      Activity activity
              ) {{

                  try {{

                      Window window =
                              activity.getWindow();

                      if (
                          Build.VERSION.SDK_INT >= 21
                      ) {{

                          window.setStatusBarColor(
                                  Color.WHITE
                          );

                          window.setNavigationBarColor(
                                  Color.WHITE
                          );
                      }


                      View decor =
                              window.getDecorView();

                      int flags =
                              decor
                              .getSystemUiVisibility();

                      if (
                          Build.VERSION.SDK_INT >= 23
                      ) {{

                          flags |=
                                  View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      }


                      if (
                          Build.VERSION.SDK_INT >= 26
                      ) {{

                          flags |=
                                  View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }


                      decor.setSystemUiVisibility(
                              flags
                      );

                  }} catch (
                          Throwable ignored
                  ) {{

                  }}
              }}


              private void addPremiumButton(
                      Activity activity
              ) {{

                  if (
                      FEATURE < 11
                  ) {{
                      return;
                  }}


                  ViewGroup content =
                          activity.findViewById(
                                  android.R.id.content
                          );


                  if (
                      !(content instanceof FrameLayout)
                  ) {{
                      return;
                  }}


                  FrameLayout root =
                          (FrameLayout) content;


                  if (
                      root.findViewWithTag(
                              "arrow_premium_menu"
                      ) != null
                  ) {{
                      return;
                  }}


                  TextView button =
                          new TextView(
                                  activity
                          );


                  button.setTag(
                          "arrow_premium_menu"
                  );


                  button.setText(
                          "≡"
                  );


                  button.setTextSize(
                          23f
                  );


                  button.setTextColor(
                          Color.rgb(
                                  16,
                                  24,
                                  40
                          )
                  );


                  button.setGravity(
                          Gravity.CENTER
                  );


                  button.setBackground(
                          background(
                                  Color.argb(
                                          245,
                                          248,
                                          250,
                                          252
                                  ),
                                  dp(
                                          activity,
                                          18
                                  )
                          )
                  );


                  if (
                      Build.VERSION.SDK_INT >= 21
                  ) {{

                      button.setElevation(
                              dp(
                                      activity,
                                      5
                              )
                      );
                  }


                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(
                                          activity,
                                          44
                                  ),
                                  dp(
                                          activity,
                                          44
                                  )
                          );


                  params.gravity =
                          Gravity.TOP |
                          Gravity.END;


                  params.topMargin =
                          dp(
                                  activity,
                                  54
                          );


                  params.rightMargin =
                          dp(
                                  activity,
                                  12
                          );


                  root.addView(
                          button,
                          params
                  );


                  button.setOnClickListener(
                          view -> {{

                              if (
                                  prefs().getBoolean(
                                          "haptics",
                                          true
                                  )
                              ) {{

                                  view.performHapticFeedback(
                                          android.view.
                                          HapticFeedbackConstants.
                                          KEYBOARD_TAP
                                  );
                              }


                              showPremiumMenu(
                                      activity
                              );
                          }}
                  );
              }}


              private String menuText() {{

                  StringBuilder text =
                          new StringBuilder();


                  text.append(
                          "200 puzzle levels\\n"
                  );


                  text.append(
                          "Snake-path arrow escape\\n"
                  );


                  if (
                      FEATURE >= 12
                  ) {{

                      text.append(
                              "\\nCoins: "
                      );

                      text.append(
                              prefs().getInt(
                                      "coins",
                                      0
           )
                      );


                      text.append(
                              "\\nDaily streak: "
                      );

                      text.append(
                              prefs().getInt(
                                      "streak",
                                      0
                              )
                      );
                  }


                  if (
                      FEATURE >= 13
                  ) {{

                      text.append(
                              "\\n\\nTutorial and accessibility settings"
                      );
                  }


                  if (
                      FEATURE >= 14
                  ) {{

                      text.append(
                              "\\nSafe test-ad configuration"
                      );
                  }


                  if (
                      FEATURE >= 15
                  ) {{

                      text.append(
                              "\\nRelease polish enabled"
                      );
                  }


                  return text.toString();
              }}


              private void showPremiumMenu(
                      Activity activity
              ) {{

                  AlertDialog.Builder dialog =
                          new AlertDialog.Builder(
                                  activity
                          );


                  dialog.setTitle(
                          "Arrow Escape Pro"
                  );


                  dialog.setMessage(
                          menuText()
                  );


                  dialog.setPositiveButton(
                          "PLAY",
                          null
                  );


                  if (
                      FEATURE >= 12
                  ) {{

                      dialog.setNeutralButton(
                              "DAILY REWARD",
                              (
                                  d,
                                  which
                              ) -> claimDailyReward(
                                      activity
                              )
                      );
                  }


                  if (
                      FEATURE >= 13
                  ) {{

                      dialog.setNegativeButton(
                              "SETTINGS",
                              (
                                  d,
                                  which
                              ) -> showSettings(
                                      activity
                              )
                      );
                  }


                  dialog.show();
              }}


              private void claimDailyReward(
                      Activity activity
              ) {{

                  long today =
                          System.currentTimeMillis()
                          / 86400000L;


                  long last =
                          prefs().getLong(
                                  "reward_day",
                                  -1L
                          );


                  if (
                      last == today
                  ) {{

                      Toast.makeText(
                              activity,
                              "Reward already claimed today",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }


                  int coins =
                          prefs().getInt(
                                  "coins",
                                  0
                          ) + 100;


                  int streak =
                          prefs().getInt(
                                  "streak",
                                  0
                          );


                  if (
                      last == today - 1
                  ) {{

                      streak++;

                  }} else {{

                      streak = 1;
                  }


                  prefs()
                      .edit()
                      .putLong(
                              "reward_day",
                              today
                      )
                      .putInt(
                              "coins",
                              coins
                      )
                      .putInt(
                              "streak",
                              streak
                      )
                      .apply();


                  Toast.makeText(
                          activity,
                          "+100 coins • Streak "
                          + streak,
                          Toast.LENGTH_LONG
                  ).show();
              }}


              private void showSettings(
                      Activity activity
              ) {{

                  String[] options =
                          new String[] {{
                              "Interface haptics",
                              "High contrast",
                              "Show tutorial again"
                          }};


                  boolean[] selected =
                          new boolean[] {{
                              prefs().getBoolean(
                                      "haptics",
                                      true
                              ),
                              prefs().getBoolean(
                                      "contrast",
                                      false
                              ),
                              false
                          }};


                  new AlertDialog.Builder(
                          activity
                  )
                  .setTitle(
                          "Settings & Accessibility"
                  )
                  .setMultiChoiceItems(
                          options,
                          selected,
                          (
                              dialog,
                              which,
                              enabled
                          ) -> {{

                              if (
                                  which == 0
                              ) {{

                                  prefs()
                                      .edit()
                                      .putBoolean(
                                              "haptics",
                                              enabled
                                      )
                                      .apply();
                              }


                              if (
                                  which == 1
                              ) {{

                                  prefs()
                                      .edit()
                                      .putBoolean(
                                              "contrast",
                                              enabled
                                      )
                                      .apply();
                              }


                              if (
                                  which == 2
                                  &&
                                  enabled
                              ) {{

                                  prefs()
                                      .edit()
                                      .putBoolean(
                                              "tutorial_done",
                                              false
                                      )
                                      .apply();
                              }
                          }}
                  )
                  .setPositiveButton(
                          "DONE",
                          null
                  )
                  .show();
              }}


              private void showTutorial(
                      Activity activity
              ) {{

                  if (
                      FEATURE < 13
                  ) {{
                      return;
                  }}


                  if (
                      prefs().getBoolean(
                              "tutorial_done",
                              false
                      )
                  ) {{
                      return;
                  }}


                  View content =
                          activity.findViewById(
                                  android.R.id.content
                          );


                  if (
                      content == null
                  ) {{
                      return;
                  }}


                  content.postDelayed(
                          () -> {{

                              if (
                                  activity.isFinishing()
                              ) {{
                                  return;
                              }}


                              new AlertDialog.Builder(
                                      activity
                              )
                              .setTitle(
                                      "How to play"
                              )
                              .setMessage(
                                      "Tap an arrow only when the straight escape line in front of its arrowhead is clear.\\n\\n"
                                      +
                                      "The arrowhead travels in one straight line while the body follows through its bends.\\n\\n"
                                      +
                                      "Blocked taps cost a heart. Clear every arrow to complete the puzzle."
                              )
                              .setPositiveButton(
                                      "GOT IT",
                                      (
                                          dialog,
                                          which
                                      ) -> prefs()
                                          .edit()
                                          .putBoolean(
                                                  "tutorial_done",
                                                  true
                                          )
                                          .apply()
                              )
                              .show();

                          }},
                          500
                  );
              }}


              @Override
              public void onActivityResumed(
                      Activity activity
              ) {{

                  polishBars(
                          activity
                  );

                  addPremiumButton(
                          activity
                  );

                  showTutorial(
                          activity
                  );
              }}


              @Override
              public void onActivityCreated(
                      Activity activity,
                      Bundle state
              ) {{

              }}


              @Override
              public void onActivityStarted(
                      Activity activity
              ) {{

              }}


              @Override
              public void onActivityPaused(
                      Activity activity
              ) {{

              }}


              @Override
              public void onActivityStopped(
                      Activity activity
              ) {{

              }}


              @Override
              public void onActivitySaveInstanceState(
                      Activity activity,
                      Bundle state
              ) {{

              }}


              @Override
              public void onActivityDestroyed(
                      Activity activity
              ) {{

              }}
          }}
          '''


           return (
                  template
                  .replace(
                      "{feature}",
                      str(feature)
                  )
                  .replace(
                      "{{",
                      "{"
                  )
                  .replace(
                      "}}",
                      "}"
                  )
              )


          def write_premium_application(
                  root,
                  feature
          ):

              configure_application(
                  root
              )

              java = (
                  root /
                  "app/src/main/java/com/arrowescape/pro/PremiumApplication.java"
              )

              java.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              java.write_text(
                  premium_application(
                      feature
                  )
              )


          def add_release_metadata(
                  root,
                  version
          ):

              assets = (
                  root /
                  "app/src/main/assets"
              )

              assets.mkdir(
                  parents=True,
                  exist_ok=True
              )

              metadata = {
                  "version": version,
                  "features": {
                      "snake_escape": True,
                      "gameplay_polish":
                          version >= 9,
                      "difficulty_progression":
                          version >= 10,
                      "premium_menu":
                          version >= 11,
                      "daily_rewards":
                          version >= 12,
                      "tutorial_accessibility":
                          version >= 13,
                      "safe_test_ads":
                          version >= 14,
                      "release_polish":
                          version >= 15
                  }
              }

              (
                  assets /
                  "release_features.json"
              ).write_text(
                  json.dumps(
                      metadata,
                      indent=2
                  )
              )


          def add_v14_ads_info(root):

              assets = (
                  root /
                  "app/src/main/assets"
              )

              assets.mkdir(
                  parents=True,
                  exist_ok=True
              )

              (
                  assets /
                  "ads_mode.txt"
              ).write_text(
                  "TEST MODE\n"
                  "Google official test AdMob IDs only.\n"
                  "Replace with production IDs before release.\n"
              )


          def add_v15_icon(root):

              drawable = (
                  root /
                  "app/src/main/res/drawable"
              )

              drawable.mkdir(
                  parents=True,
                  exist_ok=True
              )

              icon = (
                  drawable /
                  "ic_arrow_escape.xml"
              )

              icon.write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#101828"
                  android:pathData="M8,8 L100,8 L100,100 L8,100 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,57 L66,57 L53,44 L61,36 L88,63 L61,90 L53,82 L66,69 L24,69 Z" />

          </vector>
          '''
              )

              manifest = (
                  root /
                  "app/src/main/AndroidManifest.xml"
              )

              text = manifest.read_text()

              if re.search(
                  r'android:icon="[^"]+"',
                  text
              ):

                  text = re.sub(
                      r'android:icon="[^"]+"',
                      'android:icon="@drawable/ic_arrow_escape"',
                      text,
                      count=1
                  )

              else:

                  text = text.replace(
                      "<application",
                      '<application android:icon="@drawable/ic_arrow_escape"',
                      1
                  )


              manifest.write_text(
                  text
              )


          # --------------------------------------------------------
          # BUILD THE VERSION TREE
          # --------------------------------------------------------

          previous = BASE

          for version in range(
                  9,
                  16
          ):

              current = Path(
                  f"ArrowMazeFaithfulV{version}"
              )

              if current.exists():

                  shutil.rmtree(
                      current
                  )


              shutil.copytree(
                  previous,
                  current
              )


              set_version(
                  current,
                  version
              )


              set_label(
                  current
              )


              # V9
              if version == 9:

                  patch_v9_gameplay(
                      current
                  )


              # V10
              if version == 10:

                  improve_level_order(
                      current
                  )


              # V11+
              if version >= 11:

                  write_premium_application(
                      current,
                      version
                  )


              # V14
              if version >= 14:

                  add_v14_ads_info(
                      current
                  )


              # V15
              if version >= 15:

                  add_v15_icon(
