name: Build Arrow Maze Faithful V6 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Faithful V6 source
        shell: bash
        run: |
          set -e
          rm -rf ArrowMazeFaithfulV6 ArrowMazeDenseV5 /tmp/v6patch
          unzip -q ArrowMazeDenseV5-Source.zip
          mv ArrowMazeDenseV5 ArrowMazeFaithfulV6
          mkdir -p /tmp/v6patch
          echo '' | base64 -d > /tmp/v6payload.tar.xz
          tar -xJf /tmp/v6payload.tar.xz -C /tmp/v6patch
          cp /tmp/v6patch/ArrowGameView.java ArrowMazeFaithfulV6/app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          cp /tmp/v6patch/filter_levels_v6.py /tmp/filter_levels_v6.py
          python /tmp/filter_levels_v6.py
          sed -i 's/versionCode = 6/versionCode = 7/' ArrowMazeFaithfulV6/app/build.gradle.kts
          sed -i 's/versionName = "5.0.0"/versionName = "6.0.0"/' ArrowMazeFaithfulV6/app/build.gradle.kts
          sed -i 's/android:label="Arrow Maze"/android:label="Arrow Escape Maze"/' ArrowMazeFaithfulV6/app/src/main/AndroidManifest.xml
          python -c "from pathlib import Path; line=Path('ArrowMazeFaithfulV6/app/src/main/assets/levels.txt').read_text().splitlines()[42]; assert len(line.split('|',1)[1].split(';'))==72; print('Level 43 verified: 72 pieces')"

      - uses: actions/setup-java@v5
            - name: Apply V7 straight arrow travel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "ArrowMazeFaithfulV6/app/src/main/java/"
              "com/arrowescape/pro/ArrowGameView.java"
          )

          s = path.read_text()

          # OLD:
          # Every arrow completes its movement in 0.34 sec.
          old_update = """p.moveT += dt / 0.34f;"""

          # V7:
          # Distance controls duration.
          # The object moves only in its arrowhead direction.
          new_update = """float travelPx = Math.max(cell, p.moveSteps * cell);
                  float speedPxPerSec = Math.max(getWidth() * 1.45f, cell * 10f);
                  float travelSec = Math.max(0.28f,
                          Math.min(0.90f, travelPx / speedPxPerSec));
                  p.moveT += dt / travelSec;"""

          if old_update not in s:
              raise SystemExit("V7 ERROR: movement code not found")

          s = s.replace(old_update, new_update, 1)

          # Do NOT fade the arrow while escaping.
          old_alpha = """int alpha = p.moving ? Math.max(30, (int)(255*(1f-p.moveT*0.65f))) : 255;"""
          new_alpha = """int alpha = 255;"""

          if old_alpha not in s:
              raise SystemExit("V7 ERROR: animation alpha code not found")

          s = s.replace(old_alpha, new_alpha, 1)

          # Important verification:
          # These two lines mean the whole rigid arrow travels ONLY
          # in the direction of the arrowhead.
          expected = """float sx = p.dx*shift, sy = p.dy*shift;"""
          if expected not in s:
              raise SystemExit("V7 ERROR: straight-direction translation missing")

          path.write_text(s)

          print("V7 straight travel enabled")
          print("RIGHT  = +X only")
          print("LEFT   = -X only")
          print("DOWN   = +Y only")
          print("UP     = -Y only")
          print("No fade; piece removed only after travel completes")
          PY

          sed -i 's/versionCode = 7/versionCode = 8/' \
            ArrowMazeFaithfulV6/app/build.gradle.kts

          sed -i 's/versionName = "6.0.0"/versionName = "7.0.0"/' \
            ArrowMazeFaithfulV6/app/build.gradle.kts
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: ArrowMazeFaithfulV6
        run: gradle :app:assembleDebug --stacktrace

            - name: Prepare APK
        run: cp ArrowMazeFaithfulV6/app/build/outputs/apk/debug/app-debug.apk ArrowMazeFaithfulV7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeFaithfulV7-APK
          path: ArrowMazeFaithfulV7.apk
