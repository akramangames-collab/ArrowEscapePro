name: Build Arrow Maze Faithful V8 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare V8 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ArrowMazeFaithfulV8 ArrowMazeDenseV5 /tmp/v8patch
          mkdir -p /tmp/v8patch

          # Recover the known-good V6 source.
          git show d75a5cf10678c316bf8719a9f0762f71d1ca5d9a:.github/workflows/build.yml \
            > /tmp/v6-success.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import base64

          text = Path("/tmp/v6-success.yml").read_text()

          m = re.search(
              r"echo '([^']+)' \| base64 -d > /tmp/v6payload\.tar\.xz",
              text
          )

          if not m:
              raise SystemExit("Could not recover V6 payload")

          Path("/tmp/v6payload.tar.xz").write_bytes(
              base64.b64decode(m.group(1))
          )
          PY

          tar -xJf /tmp/v6payload.tar.xz -C /tmp/v8patch

          unzip -q ArrowMazeDenseV5-Source.zip
          mv ArrowMazeDenseV5 ArrowMazeFaithfulV8

          cp /tmp/v8patch/filter_levels_v6.py \
            /tmp/filter_levels_v8.py

          sed -i 's/ArrowMazeFaithfulV6/ArrowMazeFaithfulV8/g' /tmp/filter_levels_v8.py

          python3 /tmp/filter_levels_v8.py

          # Recover the V8 snake-animation Python patch
          # from the previous V8 commit.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          bad = subprocess.check_output(
              [
                  "git",
                  "show",
                  "07aff3ffb0c113ab6da2dc5c37cb9f920b653083:.github/workflows/build.yml"
              ],
              text=True
          )

          blocks = re.findall(
              r"          python3 - <<'PY'\n(.*?)\n          PY",
              bad,
              re.S
          )

          if len(blocks) < 2:
              raise SystemExit("Could not recover V8 patch")

          block = blocks[1]

          lines = []

          for line in block.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)

          script = "\n".join(lines) + "\n"

          Path("/tmp/v8_patch.py").write_text(script)

          print(
              "Recovered V8 snake escape patch:",
              len(script),
              "characters"
          )
          PY

          python3 /tmp/v8_patch.py

          # Set V8 version.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "ArrowMazeFaithfulV8/app/build.gradle.kts"
          )

          s = p.read_text()

          s = re.sub(
              r"versionCode\s*=\s*\d+",
              "versionCode = 9",
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "8.0.0"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          # Verify the main comparison level.
          python3 - <<'PY'
          from pathlib import Path

          line = Path(
              "ArrowMazeFaithfulV8/app/src/main/assets/levels.txt"
          ).read_text().splitlines()[42]

          count = len(
              line.split("|", 1)[1].split(";")
          )

          assert count == 72

          print("Level 43 verified:", count, "arrows")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build V8 APK
        working-directory: ArrowMazeFaithfulV8
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp \
            ArrowMazeFaithfulV8/app/build/outputs/apk/debug/app-debug.apk \
            ArrowMazeFaithfulV8.apk

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeFaithfulV8-APK
          path: ArrowMazeFaithfulV8.apk
