name: Build Arrow Maze Ultra Dense v5 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract game source
        run: |
          unzip -o ArrowMazeDenseV5-Source.zip
          ls -la ArrowMazeDenseV5

      - name: Build APK
        working-directory: ArrowMazeDenseV5
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp ArrowMazeDenseV5/app/build/outputs/apk/debug/app-debug.apk ArrowMazeDenseV5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeDenseV5-APK
          path: ArrowMazeDenseV5.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArrowEscapePro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscapePro-APK
          path: ArrowEscapePro.apk

