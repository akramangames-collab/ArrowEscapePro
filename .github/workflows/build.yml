name: Build Arrow Maze Faithful V7 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare V7 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ArrowMazeFaithfulV6 ArrowMazeDenseV5 /tmp/v6patch
          mkdir -p /tmp/v6patch

          # Recover the known-good V6 payload from the successful V6 commit.
          git show d75a5cf10678c316bf8719a9f0762f71d1ca5d9a:.github/workflows/build.yml > /tmp/v6-success.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import base64

          text = Path("/tmp/v6-success.yml").read_text()

          match = re.search(
              r"echo '([^']+)' \| base64 -d > /tmp/v6payload\.tar\.xz",
              text
          )

          if not match:
              raise SystemExit("Could not recover V6 payload")

          payload = base64.b64decode(match.group(1))
          Path("/tmp/v6payload.tar.xz").write_bytes(payload)

          print("Recovered V6 payload:", len(payload), "bytes")
          PY

          tar -xJf /tmp/v6payload.tar.xz -C /tmp/v6patch

          unzip -q ArrowMazeDenseV5-Source.zip
          mv ArrowMazeDenseV5 ArrowMazeFaithfulV6

          cp /tmp/v6patch/ArrowGameView.java \
            ArrowMazeFaithfulV6/app/src/main/java/com/arrowescape/pro/ArrowGameView.java

          cp /tmp/v6patch/filter_levels_v6.py \
            /tmp/filter_levels_v6.py

          # Preserve V6 level layouts.
          python3 /tmp/filter_levels_v6.py

          # -------------------------------
          # V7 ARROW ESCAPE ANIMATION FIX
          # -------------------------------
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "ArrowMazeFaithfulV6/app/src/main/java/"
              "com/arrowescape/pro/ArrowGameView.java"
          )

          s = path.read_text()

          # Old animation:
          # every arrow vanished very quickly in 0.34 seconds.
          old_move = "p.moveT += dt / 0.34f;"

          new_move = """float travelPx = Math.max(cell, p.moveSteps * cell);
                  float speedPxPerSec =
                          Math.max(getWidth() * 1.25f, cell * 8f);

                  float travelSec = Math.max(
                          0.32f,
                          Math.min(
                                  0.95f,
                                  travelPx / speedPxPerSec
                          )
                  );

                  p.moveT += dt / travelSec;"""

          if old_move not in s:
              raise SystemExit(
                  "V7 ERROR: old movement code was not found"
              )

          s = s.replace(
              old_move,
              new_move,
              1
          )

          # Remove fade-out.
          old_alpha = (
              "int alpha = p.moving ? "
              "Math.max(30, (int)(255*(1f-p.moveT*0.65f))) "
              ": 255;"
          )

          if old_alpha not in s:
              raise SystemExit(
                  "V7 ERROR: movement fade code was not found"
              )

          s = s.replace(
              old_alpha,
              "int alpha = 255;",
              1
          )

          # Critical:
          # whole arrow translates ONLY along arrow-head direction.
          required = (
              "float sx = p.dx*shift, "
              "sy = p.dy*shift;"
          )

          if required not in s:
              raise SystemExit(
                  "V7 ERROR: straight-line translation missing"
              )

          path.write_text(s)

          print("================================")
          print("V7 STRAIGHT ARROW TRAVEL ENABLED")
          print("RIGHT -> moves only right")
          print("LEFT  -> moves only left")
          print("UP    -> moves only up")
          print("DOWN  -> moves only down")
          print("Whole bent arrow stays rigid")
          print("No fade while travelling")
          print("Removed only after exit")
          print("================================")
          PY

          # Set V7 version.
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path(
              "ArrowMazeFaithfulV6/app/build.gradle.kts"
          )

          s = gradle.read_text()

          s = re.sub(
              r"versionCode\s*=\s*\d+",
              "versionCode = 8",
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "7.0.0"',
              s,
              count=1
          )

          gradle.write_text(s)

          manifest = Path(
              "ArrowMazeFaithfulV6/app/src/main/"
              "AndroidManifest.xml"
          )

          s = manifest.read_text()

          s = re.sub(
              r'android:label="[^"]+"',
              'android:label="Arrow Escape Maze"',
              s,
              count=1
          )

          manifest.write_text(s)
          PY

          # Verify level 43 still contains 72 arrows.
          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "ArrowMazeFaithfulV6/app/src/main/"
              "assets/levels.txt"
          ).read_text().splitlines()

          level43 = lines[42]

          pieces = len(
              level43.split("|", 1)[1].split(";")
          )

          assert pieces == 72, (
              f"Level 43 expected 72 arrows, got {pieces}"
          )

          print("Level 43 verified:", pieces, "arrows")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build V7 APK
        working-directory: ArrowMazeFaithfulV6
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp \
            ArrowMazeFaithfulV6/app/build/outputs/apk/debug/app-debug.apk \
            ArrowMazeFaithfulV7.apk

      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeFaithfulV7-APK
          path: ArrowMazeFaithfulV7.apk
