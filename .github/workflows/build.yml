name: Build Arrow Escape Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          echo '' | base64 -d > project.tar.gz
          tar -xzf project.tar.gz
          cp -a ArrowEscapeBootstrapProject/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArrowEscapePro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscapePro-APK
          path: ArrowEscapePro.apk

