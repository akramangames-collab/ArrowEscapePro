        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # ============================================================
      # BUILD ALL APK VERSIONS
      # ============================================================

      - name: Build V9 to V15 APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-apks

          for VERSION in \
            9 \
            10 \
            11 \
            12 \
            13 \
            14 \
            15
          do

            echo ""
            echo "=========================================="
            echo " BUILDING ARROW ESCAPE PRO V${VERSION}"
            echo "=========================================="
            echo ""

            PROJECT="ArrowMazeFaithfulV${VERSION}"

            if [ ! -d "${PROJECT}" ]
            then
              echo "Missing project: ${PROJECT}"
              exit 1
            fi

            (
              cd "${PROJECT}"

              gradle \
                :app:assembleDebug \
                --stacktrace
            )

            APK="${PROJECT}/app/build/outputs/apk/debug/app-debug.apk"

            if [ ! -f "${APK}" ]
            then
              echo "APK missing for V${VERSION}"
              exit 1
            fi

            cp \
              "${APK}" \
              "release-apks/ArrowEscapePro-V${VERSION}.apk"

            echo ""
            echo "V${VERSION} APK CREATED:"
            ls -lh \
              "release-apks/ArrowEscapePro-V${VERSION}.apk"
            echo ""

          done

          echo ""
          echo "=========================================="
          echo " ALL V9-V15 BUILDS COMPLETED"
          echo "=========================================="
          echo ""

          ls -lh release-apks/

      # ============================================================
      # VERIFY EVERY APK EXISTS
      # ============================================================

      - name: Verify all APK files
        shell: bash
        run: |
          set -euo pipefail

          for VERSION in \
            9 \
            10 \
            11 \
            12 \
            13 \
            14 \
            15
          do

            APK="release-apks/ArrowEscapePro-V${VERSION}.apk"

            if [ ! -s "${APK}" ]
            then
              echo "FAILED: ${APK}"
              exit 1
            fi

            SIZE=$(stat -c%s "${APK}")

            echo \
              "V${VERSION}: ${SIZE} bytes"

