name: Build Arrow Escape V16
on:
  push:
    branches: [main, v16-puzzle-maze]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arrow-v16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify 200 hard mazes and V15 movement
        run: python3 scripts/verify-levels.py
      - name: Verify wallet transactions and persistence
        run: bash scripts/test-wallet.sh
      - name: Build debug, release and device tests
        run: gradle :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Verify variant ad IDs and package metadata
        run: python3 scripts/verify-build.py
      - name: Package build artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ArrowEscape-PuzzleMaze-V16-test.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ArrowEscape-PuzzleMaze-V16-release-unsigned.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/ArrowEscape-V16-tests.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-V16-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 30
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ArrowEscape-V16-APKs
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native gameplay and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArrowEscape-V16-device-checks
          path: device-results/
          if-no-files-found: error
