name: Build Arrow Maze Faithful V8 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare V8 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ArrowMazeFaithfulV8 ArrowMazeDenseV5 /tmp/v8patch
          mkdir -p /tmp/v8patch

          # Recover known-good V6 source patch.
          git show d75a5cf10678c316bf8719a9f0762f71d1ca5d9a:.github/workflows/build.yml \
            > /tmp/v6-success.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import base64

          text = Path("/tmp/v6-success.yml").read_text()

          m = re.search(
              r"echo '([^']+)' \| base64 -d > /tmp/v6payload\.tar\.xz",
              text
          )

          if not m:
              raise SystemExit("Could not recover V6 payload")

          Path("/tmp/v6payload.tar.xz").write_bytes(
              base64.b64decode(m.group(1))
          )
          PY

          tar -xJf /tmp/v6payload.tar.xz -C /tmp/v8patch

          unzip -q ArrowMazeDenseV5-Source.zip
          mv ArrowMazeDenseV5 ArrowMazeFaithfulV8

          cp /tmp/v8patch/ArrowGameView.java \
            ArrowMazeFaithfulV8/app/src/main/java/com/arrowescape/pro/ArrowGameView.java

          cp /tmp/v8patch/filter_levels_v6.py \
            /tmp/filter_levels_v8.py

          python3 /tmp/filter_levels_v8.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "ArrowMazeFaithfulV8/app/src/main/java/"
              "com/arrowescape/pro/ArrowGameView.java"
          )

          s = path.read_text()

          # ---------------------------------------
          # V8 ANIMATION SPEED
          # ---------------------------------------

          s = s.replace(
              "p.moveT += dt / 0.34f;",
              """float travelPx = Math.max(cell, p.moveSteps * cell);
                  float speedPxPerSec =
                          Math.max(getWidth() * 1.45f, cell * 10f);

                  float travelSec =
                          Math.max(0.30f,
                          Math.min(1.25f,
                          travelPx / speedPxPerSec));

                  p.moveT += dt / travelSec;""",
              1
          )

          # ---------------------------------------
          # REPLACE DRAWING WITH SNAKE MOVEMENT
          # ---------------------------------------

          start = s.index(
              "    private void drawPieces(Canvas c, long now) {"
          )

          end = s.index(
              "    private void drawArrowHead(",
              start
          )

          new_draw = r'''
    private float piecePathLength(Piece p) {
        float len = 0f;

        for (int i = 0; i < p.pts.size() - 1; i++) {
            Point a = p.pts.get(i);
            Point b = p.pts.get(i + 1);

            len += Math.abs(b.x - a.x)
                    + Math.abs(b.y - a.y);
        }

        return len;
    }

    private android.graphics.PointF routePoint(
            Piece p,
            float distance
    ) {
        if (distance <= 0f) {
            Point q = p.pts.get(0);

            return new android.graphics.PointF(
                    q.x,
                    q.y
            );
        }

        float walked = 0f;

        for (int i = 0; i < p.pts.size() - 1; i++) {
            Point a = p.pts.get(i);
            Point b = p.pts.get(i + 1);

            float seg =
                    Math.abs(b.x - a.x)
                    + Math.abs(b.y - a.y);

            if (distance <= walked + seg) {
                float t =
                        (distance - walked)
                        / Math.max(0.0001f, seg);

                return new android.graphics.PointF(
                        a.x + (b.x - a.x) * t,
                        a.y + (b.y - a.y) * t
                );
            }

            walked += seg;
        }

        Point tip = p.pts.get(
                p.pts.size() - 1
        );

        float extra = distance - walked;

        return new android.graphics.PointF(
                tip.x + p.dx * extra,
                tip.y + p.dy * extra
        );
    }

    private void buildMovingSnakePath(
            Path path,
            Piece p,
            float advance
    ) {
        float total = piecePathLength(p);

        android.graphics.PointF start =
                routePoint(p, advance);

        path.moveTo(
                boardLeft + start.x * cell,
                boardTop + start.y * cell
        );

        float walked = 0f;

        for (int i = 0; i < p.pts.size() - 1; i++) {
            Point a = p.pts.get(i);
            Point b = p.pts.get(i + 1);

            float seg =
                    Math.abs(b.x - a.x)
                    + Math.abs(b.y - a.y);

            walked += seg;

            if (walked > advance) {
                path.lineTo(
                        boardLeft + b.x * cell,
                        boardTop + b.y * cell
                );
            }
        }

        android.graphics.PointF head =
                routePoint(
                        p,
                        advance + total
                );

        path.lineTo(
                boardLeft + head.x * cell,
                boardTop + head.y * cell
        );
    }

    private void drawArrowHeadAt(
            Canvas c,
            float gx,
            float gy,
            int dx,
            int dy,
            int col,
            int alpha
    ) {
        float tx = boardLeft + gx * cell;
        float ty = boardTop + gy * cell;

        float size =
                Math.max(dp(5.5f), cell * 0.28f);

        float px = -dy;
        float py = dx;

        float bx = tx - dx * size * 1.25f;
        float by = ty - dy * size * 1.25f;

        Path arrow = new Path();

        arrow.moveTo(
                tx + dx * size * 0.35f,
                ty + dy * size * 0.35f
        );

        arrow.lineTo(
                bx + px * size * 0.62f,
                by + py * size * 0.62f
        );

        arrow.lineTo(
                bx - px * size * 0.62f,
                by - py * size * 0.62f
        );

        arrow.close();

        paint.setColor(
                Color.argb(
                        alpha,
                        Color.red(col),
                        Color.green(col),
                        Color.blue(col)
                )
        );

        c.drawPath(arrow, paint);
    }

    private void drawPieces(Canvas c, long now) {
        float stroke =
                Math.max(dp(2.2f), cell * 0.12f);

        for (Piece p : pieces) {
            if (p.removed) continue;

            float shake = 0f;

            if (p.flashUntil > now) {
                shake =
                        (float)Math.sin(now * 0.085)
                        * dp(3.5f);
            }

            int col =
                    p.flashUntil > now
                    ? Color.rgb(228, 65, 71)
                    : (
                        p.hintUntil > now
                        ? Color.rgb(236, 167, 28)
                        : NAVY
                    );

            int alpha = 255;

            paint.setColor(col);
            paint.setStyle(Paint.Style.STROKE);
            paint.setStrokeWidth(stroke);
            paint.setStrokeCap(Paint.Cap.SQUARE);
            paint.setStrokeJoin(Paint.Join.ROUND);

            Path path = new Path();

            if (p.moving) {

                float advance =
                        p.moveT
                        * p.moveSteps;

                buildMovingSnakePath(
                        path,
                        p,
                        advance
                );

                c.drawPath(path, paint);

                float total =
                        piecePathLength(p);

                android.graphics.PointF head =
                        routePoint(
                                p,
                                advance + total
                        );

                paint.setStyle(Paint.Style.FILL);

                drawArrowHeadAt(
                        c,
                        head.x,
                        head.y,
                        p.dx,
                        p.dy,
                        col,
                        alpha
                );

            } else {

                for (int i = 0;
                     i < p.pts.size();
                     i++) {

                    Point q = p.pts.get(i);

                    float px =
                            boardLeft
                            + q.x * cell
                            + (p.dy != 0 ? shake : 0);

                    float py =
                            boardTop
                            + q.y * cell
                            + (p.dx != 0 ? shake : 0);

                    if (i == 0) {
                        path.moveTo(px, py);
                    } else {
                        path.lineTo(px, py);
                    }
                }

                c.drawPath(path, paint);

                paint.setStyle(Paint.Style.FILL);

                drawArrowHead(
                        c,
                        p,
                        0f,
                        0f,
                        shake,
                        col,
                        alpha
                );
            }
        }

        paint.setStyle(Paint.Style.FILL);
    }

'''

          s = s[:start] + new_draw + s[end:]

          # ---------------------------------------
          # SNAKE ESCAPE DISTANCE
          # ---------------------------------------

          marker = (
              "    private int exitSteps(Piece p)"
          )

          insert_at = s.index(marker)

          snake_helper = r'''
    private int snakeTravelSteps(Piece p) {
        int length = 0;

        for (int i = 0;
             i < p.pts.size() - 1;
             i++) {

            Point a = p.pts.get(i);
            Point b = p.pts.get(i + 1);

            length +=
                    Math.abs(b.x - a.x)
                    + Math.abs(b.y - a.y);
        }

        Point tip =
                p.pts.get(
                        p.pts.size() - 1
                );

        int exitDistance;

        if (p.dx > 0) {
            exitDistance =
                    gridW - tip.x + 3;
        } else if (p.dx < 0) {
            exitDistance =
                    tip.x + 3;
        } else if (p.dy > 0) {
            exitDistance =
                    gridH - tip.y + 3;
        } else {
            exitDistance =
                    tip.y + 3;
        }

        return length
                + Math.max(3, exitDistance);
    }

'''

          s = (
              s[:insert_at]
              + snake_helper
              + s[insert_at:]
          )

          # Every successful arrow now uses snake travel.
          s = s.replace(
              "p.moveSteps=exitSteps(p);",
              "p.moveSteps=snakeTravelSteps(p);"
          )

          # ---------------------------------------
          # COLLISION:
          # CHECK ONLY ARROWHEAD'S STRAIGHT EXIT RAY
          # ---------------------------------------

          old_clear = (
              "    private boolean isClear(Piece target)"
              "{HashSet<Long> nodes=new HashSet<>(),"
              "edges=new HashSet<>();"
              "for(Piece p:pieces)"
              "{if(p==target||p.removed||p.moving)"
              "continue;nodes.addAll(p.nodes);"
              "edges.addAll(p.edges);}"
              "return clearAgainst(target,nodes,edges);}"
          )

          new_clear = r'''
    private boolean isClear(Piece target) {
        HashSet<Long> nodes =
                new HashSet<>();

        HashSet<Long> edges =
                new HashSet<>();

        for (Piece p : pieces) {
            if (p == target
                    || p.removed
                    || p.moving) {
                continue;
            }

            nodes.addAll(p.nodes);
            edges.addAll(p.edges);
        }

        Point tip =
                target.pts.get(
                        target.pts.size() - 1
                );

        int x = tip.x;
        int y = tip.y;

        int max =
                gridW + gridH + 20;

        for (int step = 1;
             step <= max;
             step++) {

            int nx =
                    x + target.dx * step;

            int ny =
                    y + target.dy * step;

            int px =
                    x + target.dx * (step - 1);

            int py =
                    y + target.dy * (step - 1);

            if (nx < 0
                    || nx > gridW
                    || ny < 0
                    || ny > gridH) {

                return true;
            }

            if (nodes.contains(
                    nodeKey(nx, ny))) {

                return false;
            }

            if (target.dx != 0) {

                if (edges.contains(
                        edgeKey(
                                Math.min(px, nx),
                                py,
                                1))) {

                    return false;
                }

            } else {

                if (edges.contains(
                        edgeKey(
                                px,
                                Math.min(py, ny),
                                2))) {

                    return false;
                }
            }
        }

        return true;
    }
'''

          if old_clear not in s:
              raise SystemExit(
                  "Could not locate old isClear method"
              )

          s = s.replace(
              old_clear,
              new_clear,
              1
          )

          path.write_text(s)

          print("==============================")
          print("V8 SNAKE ESCAPE ENABLED")
          print("Arrow head travels straight")
          print("Body follows through bends")
          print("Corners progressively disappear")
          print("Body straightens into exit line")
          print("No rigid translation")
          print("==============================")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path(
              "ArrowMazeFaithfulV8/app/build.gradle.kts"
          )

          s = gradle.read_text()

          s = re.sub(
              r"versionCode\s*=\s*\d+",
              "versionCode = 9",
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "8.0.0"',
              s,
              count=1
          )

          gradle.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build V8 APK
        working-directory: ArrowMazeFaithfulV8
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp \
            ArrowMazeFaithfulV8/app/build/outputs/apk/debug/app-debug.apk \
            ArrowMazeFaithfulV8.apk

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeFaithfulV8-APK
          path: ArrowMazeFaithfulV8.apk
