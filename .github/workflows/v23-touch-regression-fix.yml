name: V23 Moving Clearance Repair

on:
  push:
    branches: [v23-upload-ready-nightly]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0
      - name: Apply source fix
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/arrowescape/pro/ArrowGameView.java"); s=p.read_text(); old="if (p == target\n          || p.removed) {"; new="if (p == target\n          || p.removed\n          || p.moving) {"; assert old in s, "occupancy block not found"; p.write_text(s.replace(old,new,1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          git rm .github/workflows/v23-touch-regression-fix.yml
          git commit -m "Fix moving arrows causing false blocked heart loss"
          git push origin HEAD:v23-upload-ready-nightly
