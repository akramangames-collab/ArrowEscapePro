name: V23 Quality

on:
  push:
    branches:
      - v23-upload-ready-nightly
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          "$HOME/gradle-9.6.0/bin/gradle" --version

      - name: Verify level pack
        run: python3 scripts/generate-hard-levels.py --check

      - name: Verify levels and gameplay rules
        run: python3 scripts/verify-levels.py

      - name: Verify wallet
        run: bash scripts/test-wallet.sh

      - name: Verify premium UI UX contract
        run: python3 scripts/verify-ui-ux.py

      - name: Android lint
        run: "$HOME/gradle-9.6.0/bin/gradle" :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: "$HOME/gradle-9.6.0/bin/gradle" :app:assembleDebug --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-v23-debug
          path: app/build/outputs/apk/debug/app-debug.apk
