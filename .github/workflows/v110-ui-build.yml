name: Arrow Escape 1.1.0 Premium UI Build

on:
  push:
    branches:
      - premium-ui-v110
    paths:
      - app/**
      - scripts/**
      - .github/workflows/v110-ui-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify premium UI contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          grep -q 'versionCode = 12' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          grep -q 'showProfile()' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'navButton("⌂' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'gradient(0xFF103A67' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'headerCard' app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          grep -q 'strokeRound' app/src/main/java/com/arrowescape/pro/ArrowGameView.java

      - name: Compile app and release bundle
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleAndroidTest :app:bundleRelease --stacktrace

      - name: Package outputs
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$AAB"
          test -s "$APK"
          mkdir -p dist
          cp "$AAB" dist/Arrow-Escape-1.1.0-PREMIUM-UI-UNSIGNED.aab
          cp "$APK" dist/Arrow-Escape-1.1.0-PREMIUM-UI-DEBUG.apk
          sha256sum dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.1.0-Premium-UI
          path: dist/
          if-no-files-found: error
          retention-days: 7
