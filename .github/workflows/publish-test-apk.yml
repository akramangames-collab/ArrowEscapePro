name: Publish V16.0.4 Test APK
on:
  push:
    branches: [v16-premium-ui-chests]
    paths: [.github/workflows/publish-test-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful V16.0.4 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 34186559772 --repo akramangames-collab/ArrowEscapePro --name ArrowEscape-V16-APKs --dir dist
          test -f dist/ArrowEscape-PuzzleMaze-V16-test.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v16.0.4-test --repo akramangames-collab/ArrowEscapePro --yes --cleanup-tag 2>/dev/null || true
          gh release create v16.0.4-test \
            dist/ArrowEscape-PuzzleMaze-V16-test.apk \
            --repo akramangames-collab/ArrowEscapePro \
            --target "${{ github.sha }}" \
            --title "Arrow Escape: Puzzle Maze V16.0.4 Test APK" \
            --notes "Premium UI + non-blocking treasure chest test build. Uses Google's official test ad units, not production ads." \
            --prerelease
