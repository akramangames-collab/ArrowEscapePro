name: Play Crash Hotfix v6 Verification

on:
  push:
    branches:
      - play-crash-hotfix-v6
    paths:
      - app/**
      - scripts/**
      - .github/workflows/play-crash-hotfix-v6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARROW_RELEASE_STORE_FILE: /tmp/arrow-ci-test.jks
      ARROW_RELEASE_STORE_PASSWORD: changeit
      ARROW_RELEASE_KEY_ALIAS: ci-test
      ARROW_RELEASE_KEY_PASSWORD: changeit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify game data and UI contracts
        shell: bash
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py

      - name: Create temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$ARROW_RELEASE_STORE_FILE" \
            -storepass "$ARROW_RELEASE_STORE_PASSWORD" \
            -keypass "$ARROW_RELEASE_KEY_PASSWORD" \
            -alias "$ARROW_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Arrow CI,O=CI,C=US"

      - name: Build and lint release hotfix
        shell: bash
        run: |
          gradle :app:lintDebug :app:assembleRelease :app:bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "1.0.4"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = false' app/build.gradle.kts
          grep -q 'isShrinkResources = false' app/build.gradle.kts
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        shell: bash
        run: sudo chmod 666 /dev/kvm || true

      - name: Cold launch release on Android 15 / API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.arrowescape.pro
            adb shell am start -W -n com.arrowescape.pro/.MainActivity | tee /tmp/start-api35.txt
            sleep 10
            adb shell pidof com.arrowescape.pro | tee /tmp/pid-api35.txt || true
            adb logcat -d -t 1800 | tee /tmp/logcat-api35.txt
            test -s /tmp/pid-api35.txt
            ! grep -Eq "FATAL EXCEPTION|Process: com\.arrowescape\.pro.*PID|AndroidRuntime.*FATAL" /tmp/logcat-api35.txt
            adb shell am force-stop com.arrowescape.pro
            adb shell am start -W -n com.arrowescape.pro/.MainActivity
            sleep 5
            adb shell pidof com.arrowescape.pro >/dev/null

      - name: Cold launch release on Android 16 / API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.arrowescape.pro
            adb shell am start -W -n com.arrowescape.pro/.MainActivity | tee /tmp/start-api36.txt
            sleep 10
            adb shell pidof com.arrowescape.pro | tee /tmp/pid-api36.txt || true
            adb logcat -d -t 1800 | tee /tmp/logcat-api36.txt
            test -s /tmp/pid-api36.txt
            ! grep -Eq "FATAL EXCEPTION|Process: com\.arrowescape\.pro.*PID|AndroidRuntime.*FATAL" /tmp/logcat-api36.txt
            adb shell am force-stop com.arrowescape.pro
            adb shell am start -W -n com.arrowescape.pro/.MainActivity
            sleep 5
            adb shell pidof com.arrowescape.pro >/dev/null

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrow-v6-release-verification
          path: |
            /tmp/start-api35.txt
            /tmp/pid-api35.txt
            /tmp/logcat-api35.txt
            /tmp/start-api36.txt
            /tmp/pid-api36.txt
            /tmp/logcat-api36.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 2
