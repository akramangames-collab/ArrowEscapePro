name: Arrow Escape 1.1.4 Android 15 R8 Build

on:
  push:
    branches:
      - android15-edge-r8-v114
    paths:
      - app/**
      - .github/workflows/v114-edge-r8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify modernization contracts
        run: |
          grep -q 'versionCode = 16' app/build.gradle.kts
          grep -q 'versionName = "1.1.4"' app/build.gradle.kts
          grep -q 'play-services-ads:25.5.0' app/build.gradle.kts
          grep -q 'work-runtime:2.12.0' app/build.gradle.kts
          grep -q 'room-runtime:2.8.5' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -q 'WindowCompat.enableEdgeToEdge(window);' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'setAgeRestrictedTreatment(AgeRestrictedTreatment.CHILD)' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -q 'setTagForChildDirectedTreatment(' app/src/main/java/com/arrowescape/pro/MainActivity.java

      - name: Audit release dependencies
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath > dependency-tree.txt
          echo "=== WorkManager / Room / Play Core / Ads ==="
          grep -Ei 'work-runtime|room-runtime|play-core|play:|play-services-ads|fragment|activity|core:' dependency-tree.txt || true
          grep -q 'androidx.work:work-runtime:2.12.0' dependency-tree.txt
          grep -q 'androidx.room:room-runtime:2.8.5' dependency-tree.txt

      - name: Build lint, release APK and AAB with R8
        run: gradle :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release outputs
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -s "$APK"
          test -s "$AAB"
          test -s "$MAPPING"
          unzip -t "$AAB" >/dev/null
          mkdir -p dist
          cp "$APK" dist/ArrowEscape-v1.1.4-RELEASE-UNSIGNED.apk
          cp "$AAB" dist/ArrowEscape-v1.1.4-RELEASE-UNSIGNED.aab
          cp "$MAPPING" dist/mapping.txt
          cp dependency-tree.txt dist/dependency-tree.txt
          sha256sum dist/ArrowEscape-* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-v1.1.4-Android15-R8
          path: dist/
          if-no-files-found: error
          retention-days: 7
