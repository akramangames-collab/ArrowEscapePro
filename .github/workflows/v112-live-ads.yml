name: Arrow Escape 1.1.2 Live Ads Build

on:
  push:
    branches:
      - live-ad-fill-v112
    paths:
      - app/**
      - .github/workflows/v112-live-ads.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify live ad fix
        run: |
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "1.1.2"' app/build.gradle.kts
          grep -q 'MAX_AD_CONTENT_RATING_G' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'TAG_FOR_CHILD_DIRECTED_TREATMENT_TRUE' app/src/main/java/com/arrowescape/pro/MainActivity.java
          ! grep -q 'TAG_FOR_UNDER_AGE_OF_CONSENT_TRUE' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'MAX_BANNER_RETRIES' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'requestConsentAndStartAds' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'ca-app-pub-2475015099415787/6590130477' app/build.gradle.kts
      - name: Build release APK and AAB
        run: gradle :app:lintDebug :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Package
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          mkdir -p dist
          cp "$APK" dist/ArrowEscape-v1.1.2-LIVE-ADS-UNSIGNED.apk
          cp "$AAB" dist/ArrowEscape-v1.1.2-LIVE-ADS-UNSIGNED.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-v1.1.2-Live-Ads
          path: dist/
          if-no-files-found: error
          retention-days: 7
