name: Arrow Escape 1.0.8 Banner Zoom Build

on:
  push:
    branches:
      - banner-zoom-appads-v108
    paths:
      - app/**
      - app-ads.txt
      - scripts/**
      - .github/workflows/v108-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify release contracts
        run: |
          python3 scripts/generate-hard-levels.py --check
          python3 scripts/verify-levels.py
          bash scripts/test-wallet.sh
          python3 scripts/verify-ui-ux.py
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "1.0.8"' app/build.gradle.kts
          grep -q 'ScaleGestureDetector' app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          grep -q 'PINCH TO ZOOM' app/src/main/java/com/arrowescape/pro/ArrowGameView.java
          grep -q 'getCurrentOrientationAnchoredAdaptiveBannerAdSize' app/src/main/java/com/arrowescape/pro/MainActivity.java
          grep -q 'pub-2475015099415787' app-ads.txt
          ! grep -q 'AdSize.BANNER' app/src/main/java/com/arrowescape/pro/MainActivity.java

      - name: Compile app and release bundle
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleAndroidTest :app:bundleRelease --stacktrace

      - name: Package outputs
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$AAB"
          test -s "$APK"
          test -s "$TEST_APK"
          unzip -t "$AAB" >/dev/null
          mkdir -p dist
          cp "$AAB" dist/Arrow-Escape-1.0.8-BANNER-ZOOM-UNSIGNED.aab
          cp "$APK" dist/Arrow-Escape-1.0.8-DEBUG.apk
          cp app-ads.txt dist/app-ads.txt
          sha256sum dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-1.0.8-Banner-Zoom
          path: dist/
          if-no-files-found: error
          retention-days: 7
