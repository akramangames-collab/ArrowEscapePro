name: Nonblocking Exit Flow Repair

on:
  push:
    branches: [v23-upload-ready-nightly]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[exit-flow-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Apply nonblocking exit-flow rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          s=p.read_text()
          old='if (p == target || p.removed) continue;'
          new='if (p == target || p.removed || p.moving) continue;'
          if old not in s: raise SystemExit('source patch target missing')
          s=s.replace(old,new,1)
          s=s.replace('// A moving arrow blocks only where its snake body is visibly present now.','// An accepted moving arrow is logically leaving and must not reserve the lane.',1)
          s=s.replace('// Cells already vacated by the animated tail must not cause false heart loss.','// This lets a safe follower escape immediately while the first arrow animates out.',1)
          p.write_text(s)

          p=Path('app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java')
          s=p.read_text()
          old='assertFalse("Moving bodies must still block while visibly occupying the lane",clear(g,target));'
          new='assertTrue("A safe follower must be tappable immediately behind arrows already accepted for escape",clear(g,target));'
          if old not in s: raise SystemExit('regression test patch target missing')
          p.write_text(s.replace(old,new,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compile app and tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Commit verified rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java
          git rm .github/workflows/v27-nonblocking-exit-flow.yml
          git commit -m "Let safe arrows follow an accepted escape immediately"
          git push origin HEAD:v23-upload-ready-nightly
