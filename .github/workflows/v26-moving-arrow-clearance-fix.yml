name: Fix Moving Arrow Clearance

on:
  push:
    branches:
      - v23-upload-ready-nightly

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Patch false blocked heart loss
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          text = src.read_text()
          old = """  if (p == target
          || p.removed) {
      continue;
  }
"""
          new = """  // A moving arrow has already been accepted for escape. Its remaining
  // snake animation is visual only and must not keep an otherwise clear lane blocked.
  if (p == target
          || p.removed
          || p.moving) {
      continue;
  }
"""
          if old in text:
              text = text.replace(old, new, 1)
              src.write_text(text)
          elif '|| p.moving)' not in text and '|| p.moving) {' not in text:
              raise SystemExit('Expected occupancy block not found')

          test = Path('app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java')
          t = test.read_text()
          marker = 'movingBlockersAlreadyEscapingCannotChargeHeart'
          if marker not in t:
              method = r'''

    @Test public void movingBlockersAlreadyEscapingCannotChargeHeart() throws Exception {onMain(()->{
        context().getSharedPreferences("arrow_puzzle_faithful",0).edit().clear().commit();
        context().getSharedPreferences("arrow_escape_pro",0).edit().clear().commit();
        ArrowGameView g=new ArrowGameView(context(),new Host(),new Wallet(new PreferenceWalletStorage(context())));
        try {
            set(g,"tutorial",false);
            call(g,"startLevel",new Class[]{int.class},2);
            ArrayList<Object> all=pieces(g);
            Object blockerA=all.get(9), blockerB=all.get(14), target=all.get(22);
            set(blockerA,"moving",true); set(blockerA,"moveT",0.45f);
            set(blockerB,"moving",true); set(blockerB,"moveT",0.45f);
            assertTrue("Moving escape animations must not remain logical blockers",clear(g,target));
            int hearts=(Integer)get(g,"hearts");
            call(g,"tapPiece",new Class[]{target.getClass()},target);
            assertEquals("A visually cleared lane must not cost a heart",hearts,get(g,"hearts"));
            assertTrue("The target arrow must start escaping",(Boolean)get(target,"moving"));
        } finally { g.release(); }
    });}
'''
              pos = t.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Test class closing brace not found')
              test.write_text(t[:pos] + method + t[pos:])
          PY

          grep -n "p.moving" app/src/main/java/com/arrowescape/pro/ArrowGameView.java | tail -n 10
          grep -n "movingBlockersAlreadyEscapingCannotChargeHeart" app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compile fixed signed debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Package fixed APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ArrowEscape-Pro-Moving-Clearance-Fix-Signed.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Moving-Clearance-Fix
          path: dist/
          retention-days: 30

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java
          git rm .github/workflows/v26-moving-arrow-clearance-fix.yml
          git commit -m "Fix moving arrows causing false blocked heart loss"
          git push origin HEAD:v23-upload-ready-nightly
