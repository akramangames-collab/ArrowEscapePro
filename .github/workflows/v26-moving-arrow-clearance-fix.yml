name: Fix Moving Arrow Clearance

on:
  push:
    branches: [v23-upload-ready-nightly]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[moving-clearance-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Patch moving-arrow clearance logic and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          text = src.read_text()
          old = '''  if (p == target
          || p.removed) {
      continue;
  }
'''
          new = '''  // Once an arrow's escape has been accepted, movement is only visual.
  // It must stop blocking immediately; otherwise a visibly clear lane can still
  // cost a heart until the previous snake animation fully finishes.
  if (p == target
          || p.removed
          || p.moving) {
      continue;
  }
'''
          if old not in text:
              raise SystemExit('Expected isClear occupancy block not found')
          text = text.replace(old, new, 1)
          src.write_text(text)

          test = Path('app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java')
          t = test.read_text()
          marker = 'movingBlockersAlreadyEscapingCannotChargeHeart'
          if marker not in t:
              method = r'''

    @Test public void movingBlockersAlreadyEscapingCannotChargeHeart() throws Exception {onMain(()->{
        context().getSharedPreferences("arrow_puzzle_faithful",0).edit().clear().commit();
        context().getSharedPreferences("arrow_escape_pro",0).edit().clear().commit();
        ArrowGameView g=new ArrowGameView(context(),new Host(),new Wallet(new PreferenceWalletStorage(context())));
        try {
            set(g,"tutorial",false);
            call(g,"startLevel",new Class[]{int.class},2);
            ArrayList<Object> all=pieces(g);
            Object blockerA=all.get(9), blockerB=all.get(14), target=all.get(22);

            // This is the real gameplay state immediately after the two visible
            // blockers have been tapped: they are animating out (moving=true),
            // not yet marked removed=true. They must no longer be logical blockers.
            set(blockerA,"moving",true); set(blockerA,"moveT",0.45f);
            set(blockerB,"moving",true); set(blockerB,"moveT",0.45f);

            assertTrue("An accepted/moving escape must no longer block the now-clear lane",clear(g,target));
            int hearts=(Integer)get(g,"hearts");
            call(g,"tapPiece",new Class[]{target.getClass()},target);
            assertEquals("A visually cleared lane must never lose a heart because prior arrows are still animating",hearts,get(g,"hearts"));
            assertTrue("The target arrow must start escaping immediately",(Boolean)get(target,"moving"));
        } finally { g.release(); }
    });}
'''
              pos = t.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Could not locate test class closing brace')
              t = t[:pos] + method + t[pos:]
              test.write_text(t)
          PY

          grep -n "p.moving" app/src/main/java/com/arrowescape/pro/ArrowGameView.java | tail -n 8
          grep -n "movingBlockersAlreadyEscapingCannotChargeHeart" app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build signed debug APK and instrumentation APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run focused regression tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.arrowescape.pro.V23TouchRegressionTest com.arrowescape.pro.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/v26-test.txt
            grep -q "OK (3 tests)" /tmp/v26-test.txt

      - name: Package fixed signed APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ArrowEscape-Pro-Moving-Clearance-Fix-Signed.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Moving-Clearance-Fix
          path: dist/
          retention-days: 30

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V23TouchRegressionTest.java
          git commit -m "Fix moving arrows causing false blocked heart loss [moving-clearance-done]"
          git push origin HEAD:v23-upload-ready-nightly
