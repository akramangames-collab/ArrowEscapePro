name: Final Moving Arrow Release Fix

on:
  push:
    branches:
      - v23-upload-ready-nightly

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[moving-logical-remove]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v23-upload-ready-nightly
          fetch-depth: 0

      - name: Apply final moving-arrow rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/arrowescape/pro/ArrowGameView.java')
          s = src.read_text()
          lines = s.splitlines()
          changed = False
          out = []
          i = 0
          while i < len(lines):
              if i + 3 < len(lines) and lines[i].strip() == 'if (p.moving) {' and 'willCollideWithMoving(target,p)' in lines[i+1] and lines[i+2].strip() == 'continue;' and lines[i+3].strip() == '}':
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  out.append(indent + '// Accepted escaping arrows are logically removed immediately; animation is visual only.')
                  out.append(indent + 'if (p.moving) continue;')
                  i += 4
                  changed = True
                  continue
              out.append(lines[i])
              i += 1
          if not changed:
              raise SystemExit('moving-arrow collision block not found')
          src.write_text('\n'.join(out) + '\n')

          test = Path('app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java')
          t = test.read_text()
          old = 'assertFalse("A moving arrow must still block when live future snake bodies actually collide",clear(g,crossingTarget));'
          new = 'assertTrue("An accepted moving arrow is logically gone even if its exit animation visually crosses another escape",clear(g,crossingTarget));'
          if old not in t:
              raise SystemExit('V17 moving collision assertion not found')
          test.write_text(t.replace(old, new, 1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0' platform-tools >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'
      - name: Compile app and instrumentation tests
        run: gradle :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Commit final rule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/arrowescape/pro/ArrowGameView.java app/src/androidTest/java/com/arrowescape/pro/V17ClearanceTest.java
          git commit -m 'Treat accepted moving arrows as logically removed'
          git push origin HEAD:v23-upload-ready-nightly
